<html lang="en">
<head>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root {
  /* Tier 1: Pixel-sampled event banner color ramp (image_5dce2ae2.png) + AFJ logo accents */
  --ramp-ink-950: #080808;
  --ramp-ink-900: #171717;
  --ramp-ink-800: #272727;
  --ramp-ink-600: #525252;
  --ramp-paper-100: #F8F8F8;
  --ramp-paper-050: #FFFFFF;
  --ramp-crimson-700: #8F0D0A;
  --ramp-crimson-500: #BE110E;
  --ramp-crimson-400: #D82B22;
  --ramp-coral-500: #FF8560;
  --ramp-coral-300: #FFA88C;
  --ramp-yellow-500: #F7F40F;
  --ramp-yellow-300: #FBF96B;
  --ramp-gold-500: #CC9A39;
  --ramp-ochre-500: #CF7946;
  --ramp-rose-500: #C13952;

  /* Tier 2: Semantic design tokens */
  --surface-obsidian: var(--ramp-ink-950);
  --surface-charcoal: var(--ramp-ink-900);
  --surface-coral: var(--ramp-coral-500);
  --surface-paper: var(--ramp-paper-050);
  --surface-paper-soft: var(--ramp-paper-100);
  --text-strong: var(--ramp-paper-050);
  --text-on-ink: var(--ramp-coral-500);
  --text-on-light: var(--ramp-ink-950);
  --text-muted-on-paper: var(--ramp-ink-800);
  --border-subtle-dark: var(--ramp-ink-800);
  --accent-cta: var(--ramp-crimson-500);
  --accent-cta-deep: var(--ramp-crimson-700);
  --accent-highlight: var(--ramp-yellow-500);
  --accent-gold: var(--ramp-gold-500);
  --accent-ochre: var(--ramp-ochre-500);
  --accent-rose: var(--ramp-rose-500);

  /* Semantic QR & status tokens (100% poster ramp, WCAG AA+) */
  --status-valid-bg: var(--ramp-ink-950);
  --status-valid-fg: var(--ramp-paper-050);
  --status-valid-accent: var(--ramp-yellow-500);
  --status-warn-bg: var(--ramp-yellow-500);
  --status-warn-fg: var(--ramp-ink-950);
  --status-error-bg: var(--ramp-crimson-500);
  --status-error-fg: var(--ramp-paper-050);
  --status-checking-bg: var(--ramp-gold-500);
  --status-checking-fg: var(--ramp-ink-950);

  /* Backward-compatible layout & surface aliases */
  --sodium: var(--surface-coral);
  --ink: var(--surface-obsidian);
  --paper: var(--surface-paper);
  --blue: var(--accent-cta);
  --pink: var(--accent-highlight);
  --green: var(--accent-rose);
  --lavender: var(--accent-gold);
  --coral: var(--accent-ochre);

  --s1: 4px;
  --s2: 8px;
  --s3: 16px;
  --s4: 24px;
  --s5: 32px;
  --s6: 48px;
  --s7: 64px;
  --s8: 96px;
  --s9: 128px;
  --s10: 160px;

  --cols: 4;
  --gutter: 10px;
  --margin: 16px;
  --sec-pad: 64px;
  --header-h: 56px;

  --bg: var(--surface-obsidian);
  --fg: var(--text-on-ink);
  --focus: var(--surface-coral);
  --rule-color: var(--surface-coral);
  --rule: 1px solid var(--rule-color);
  --rule-strong: 2px solid var(--rule-color);
  --poster-u: 10px;
}

@media (min-width: 390px) {
  :root {
    --gutter: 12px;
  }
}

@media (min-width: 768px) {
  :root {
    --cols: 8;
    --gutter: 12px;
    --margin: 20px;
    --sec-pad: 80px;
    --header-h: 64px;
  }
}

@media (min-width: 1024px) {
  :root {
    --cols: 12;
    --gutter: 16px;
    --margin: 24px;
    --sec-pad: 96px;
  }
}

@media (min-width: 1440px) {
  :root {
    --margin: 28px;
    --sec-pad: 128px;
  }
}

*, *::before, *::after {
  box-sizing: border-box;
  border-radius: 0;
}

html {
  font-family: "Inter Tight", "Helvetica Neue", Helvetica, Arial, system-ui, sans-serif;
  font-size: 16px;
  background-color: var(--surface-obsidian);
  color: var(--text-strong);
  scroll-padding-top: 80px;
  -webkit-font-smoothing: antialiased;
  -moz-osx-font-smoothing: grayscale;
}

@media (prefers-reduced-motion: no-preference) {
  html.motion-on {
    scroll-behavior: smooth;
  }
}

@media (prefers-reduced-motion: reduce) {
  * {
    animation-duration: 0.01ms !important;
    animation-iteration-count: 1 !important;
    transition-duration: 0.01ms !important;
  }
}

html.menu-open {
  overflow: hidden;
}

body {
  margin: 0;
  padding: 0;
  padding-top: var(--header-h);
  background-color: var(--bg);
  color: var(--fg);
  font-weight: 400;
  line-height: 1.45;
  overflow-wrap: break-word;
}

h1, h2, h3, h4, p, ul, ol, dl, dt, dd, figure, figcaption, blockquote {
  margin: 0;
  padding: 0;
}

ul, ol {
  list-style: none;
}

a {
  color: inherit;
  text-decoration: none;
}

button, input, select {
  font-family: inherit;
  color: inherit;
  background: none;
  border: 0;
  padding: 0;
  margin: 0;
  border-radius: 0;
}

button {
  cursor: pointer;
}

:focus-visible {
  outline: 3px solid var(--focus);
  outline-offset: 3px;
}

:focus:not(:focus-visible) {
  outline: none;
}

/* Surfaces */
[data-surface="sodium"] {
  --bg: var(--surface-coral);
  --fg: var(--text-on-light);
  --focus: var(--text-on-light);
  --rule-color: var(--text-on-light);
  --rule: 1px solid var(--text-on-light);
  --rule-strong: 2px solid var(--text-on-light);
  --nav-active-bg: var(--surface-obsidian);
  --nav-active-fg: var(--surface-coral);
  --btn-bg: var(--surface-obsidian);
  --btn-fg: var(--surface-coral);
  --btn-disabled-fg: var(--text-on-light);
  --btn-disabled-border: var(--text-on-light);
  --chip-border: var(--text-on-light);
  --chip-fg: var(--text-on-light);
  --chip-active-bg: var(--surface-obsidian);
  --chip-active-fg: var(--surface-coral);
  --input-bg: var(--surface-paper);
  --input-fg: var(--text-on-light);
  --input-border: var(--text-on-light);
  background-color: var(--surface-coral);
  color: var(--text-on-light);
}

[data-surface="paper"] {
  --bg: var(--surface-paper);
  --fg: var(--text-on-light);
  --focus: var(--text-on-light);
  --rule-color: var(--text-on-light);
  --rule: 1px solid var(--text-on-light);
  --rule-strong: 2px solid var(--text-on-light);
  --nav-active-bg: var(--surface-obsidian);
  --nav-active-fg: var(--surface-paper);
  --btn-bg: var(--surface-obsidian);
  --btn-fg: var(--surface-paper);
  --btn-disabled-fg: var(--text-on-light);
  --btn-disabled-border: var(--text-on-light);
  --chip-border: var(--text-on-light);
  --chip-fg: var(--text-on-light);
  --chip-active-bg: var(--surface-obsidian);
  --chip-active-fg: var(--surface-paper);
  --input-bg: var(--surface-paper);
  --input-fg: var(--text-on-light);
  --input-border: var(--text-on-light);
  background-color: var(--surface-paper);
  color: var(--text-on-light);
}

[data-surface="ink"] {
  --bg: var(--surface-obsidian);
  --fg: var(--text-on-ink);
  --focus: var(--text-on-ink);
  --rule-color: var(--border-subtle-dark);
  --rule: 1px solid var(--border-subtle-dark);
  --rule-strong: 2px solid var(--text-on-ink);
  --nav-active-bg: var(--surface-coral);
  --nav-active-fg: var(--surface-obsidian);
  --btn-bg: var(--surface-coral);
  --btn-fg: var(--surface-obsidian);
  --btn-disabled-fg: var(--text-on-ink);
  --btn-disabled-border: var(--text-on-ink);
  --chip-border: var(--text-on-ink);
  --chip-fg: var(--text-on-ink);
  --chip-active-bg: var(--surface-coral);
  --chip-active-fg: var(--surface-obsidian);
  --input-bg: var(--surface-obsidian);
  --input-fg: var(--text-on-ink);
  --input-border: var(--text-on-ink);
  background-color: var(--surface-obsidian);
  color: var(--text-on-ink);
}

/* Typography scale */
.t-micro {
  font-size: clamp(0.75rem, 0.72rem + 0.1vw, 0.8125rem);
  font-weight: 500;
  line-height: 1.2;
  letter-spacing: 0;
  font-variant-numeric: tabular-nums;
  font-feature-settings: "tnum" 1, "zero" 1;
}

.t-small {
  font-size: clamp(0.875rem, 0.83rem + 0.2vw, 0.9375rem);
  font-weight: 500;
  line-height: 1.25;
  letter-spacing: -0.005em;
}

.t-body {
  font-size: clamp(1rem, 0.94rem + 0.25vw, 1.125rem);
  font-weight: 400;
  line-height: 1.45;
  letter-spacing: -0.005em;
  max-width: 62ch;
}

.t-lead {
  font-size: clamp(1.25rem, 0.95rem + 0.95vw, 1.625rem);
  font-weight: 500;
  line-height: 1.04;
  letter-spacing: -0.02em;
}

.t-h2 {
  font-size: clamp(1.625rem, 1rem + 2vw, 2.375rem);
  font-weight: 600;
  line-height: 1.2;
  letter-spacing: -0.02em;
}

.t-h1 {
  font-size: clamp(2.5rem, 1.3rem + 3.8vw, 4.5rem);
  font-weight: 600;
  line-height: 1;
  letter-spacing: -0.035em;
}

.tnum {
  font-variant-numeric: tabular-nums;
  font-feature-settings: "tnum" 1, "zero" 1;
}

.t-paper {
  color: var(--paper);
}

.t-sodium {
  color: var(--sodium);
}

.t-ink {
  color: var(--ink);
}

.fw-600 {
  font-weight: 600;
}

.visually-hidden {
  position: absolute;
  width: 1px;
  height: 1px;
  padding: 0;
  margin: -1px;
  overflow: hidden;
  clip: rect(0 0 0 0);
  white-space: nowrap;
  border: 0;
}

/* Skip link */
.skip-link {
  position: fixed;
  top: 8px;
  left: var(--margin);
  z-index: 200;
  background-color: var(--ink);
  color: var(--sodium);
  padding: 0 var(--s3);
  height: 44px;
  display: inline-flex;
  align-items: center;
  font-size: 0.875rem;
  font-weight: 600;
  transform: translateY(-200%);
}

.skip-link:focus {
  transform: translateY(0);
  outline: 3px solid var(--sodium);
  outline-offset: 3px;
}

/* 12-col grid */
.grid {
  display: grid;
  grid-template-columns: repeat(var(--cols), minmax(0, 1fr));
  column-gap: var(--gutter);
  padding-inline: var(--margin);
  width: 100%;
}

.sec {
  padding-block: var(--sec-pad);
}

.sub-sec {
  padding-top: var(--s6);
  padding-bottom: var(--sec-pad);
}

@media (min-width: 1024px) {
  .sub-sec {
    padding-top: var(--s7);
  }
}

.col-full { grid-column: 1 / -1; }
.col-1-3 { grid-column: 1 / -1; }
.col-1-4 { grid-column: 1 / -1; }
.col-1-5 { grid-column: 1 / -1; }
.col-1-6 { grid-column: 1 / -1; }
.col-1-8 { grid-column: 1 / -1; }
.col-5-8 { grid-column: 1 / -1; }
.col-5-12 { grid-column: 1 / -1; }
.col-7-12 { grid-column: 1 / -1; }
.col-8-12 { grid-column: 1 / -1; }
.col-9-12 { grid-column: 1 / -1; }

@media (min-width: 768px) {
  .col-1-3 { grid-column: 1 / 4; }
  .col-1-4 { grid-column: 1 / 5; }
  .col-1-5 { grid-column: 1 / 5; }
  .col-1-8 { grid-column: 1 / -1; }
  .col-5-8 { grid-column: 1 / 5; }
  .col-5-12 { grid-column: 1 / -1; }
  .col-7-12 { grid-column: 5 / 9; }
  .col-8-12 { grid-column: 1 / -1; }
  .col-9-12 { grid-column: 5 / 9; }
}

@media (min-width: 1024px) {
  .col-1-3 { grid-column: 1 / 4; }
  .col-1-4 { grid-column: 1 / 5; }
  .col-1-5 { grid-column: 1 / 6; }
  .col-1-6 { grid-column: 1 / 7; }
  .col-1-8 { grid-column: 1 / 9; }
  .col-5-8 { grid-column: 5 / 9; }
  .col-5-12 { grid-column: 5 / 13; }
  .col-7-12 { grid-column: 7 / 13; }
  .col-8-12 { grid-column: 8 / 13; }
  .col-9-12 { grid-column: 9 / 13; }
}

/* Header */
.site-header {
  position: fixed;
  top: 0;
  left: 0;
  right: 0;
  height: var(--header-h);
  z-index: 50;
  display: flex;
  align-items: center;
}

.site-header[data-surface="ink"] {
  border-bottom: 1px solid var(--border-subtle-dark);
}

.header-grid {
  align-items: center;
}

.logo-link {
  grid-column: 1 / 4;
  display: inline-flex;
  align-items: center;
  min-height: 24px;
  min-width: 24px;
  padding: 6px 0;
  justify-self: start;
}

.logo-svg {
  display: block;
  width: auto;
  height: 22px;
}

@media (min-width: 768px) {
  .logo-svg {
    width: auto;
    height: 27px;
  }
}

.main-nav {
  display: none;
}

.header-actions-desktop {
  display: none;
}

.menu-btn-wrap {
  grid-column: -2 / -1;
  justify-self: end;
  display: flex;
  align-items: center;
}

.menu-btn {
  min-width: 44px;
  min-height: 44px;
  padding: 0 var(--s2);
  display: inline-flex;
  align-items: center;
  justify-content: flex-end;
}

@media (min-width: 1200px) {
  .main-nav {
    display: flex;
    grid-column: 5 / 11;
    align-items: center;
    gap: var(--s3);
  }
  .header-actions-desktop {
    display: flex;
    grid-column: 11 / 13;
    justify-self: end;
    align-items: center;
    gap: var(--s3);
    white-space: nowrap;
  }
  .menu-btn-wrap {
    display: none;
  }
}

.nav-link {
  position: relative;
  display: inline-flex;
  align-items: center;
  min-height: 24px;
  padding: 6px 4px;
  white-space: nowrap;
}

.nav-link[aria-current="page"] {
  background-color: var(--nav-active-bg, var(--ink));
  color: var(--nav-active-fg, var(--sodium));
  padding: 2px 4px;
}

/* Text buttons and animated underline */
.btn-text {
  position: relative;
  display: inline-flex;
  align-items: center;
  min-height: 24px;
  min-width: 24px;
  padding: 4px 0;
  text-align: left;
}

.u-anim::after {
  content: "";
  position: absolute;
  left: 0;
  right: 0;
  bottom: 1px;
  height: 1px;
  background-color: currentColor;
  transform: scaleX(0);
  transform-origin: left center;
}

html.motion-on .u-anim:hover::after,
html.motion-on .u-anim:focus-visible::after {
  transform: scaleX(1);
  transition: transform 180ms steps(6);
}

html:not(.motion-on) .u-anim:hover::after,
html:not(.motion-on) .u-anim:focus-visible::after {
  transform: scaleX(1);
}

.nav-link[aria-current="page"]::after {
  display: none;
}

/* Primary button */
.btn-primary {
  position: relative;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  height: 48px;
  padding: 0 20px;
  background-color: var(--btn-bg, var(--ink));
  color: var(--btn-fg, var(--sodium));
  font-weight: 600;
  overflow: hidden;
  border: 0;
  white-space: nowrap;
}

.btn-primary.btn-sm {
  height: 40px;
  padding: 0 16px;
}

.btn-primary::before {
  content: "";
  position: absolute;
  inset: 0;
  background-color: var(--blue);
  transform: scaleX(0);
  transform-origin: left center;
  z-index: 0;
}

html.motion-on .btn-primary:not([aria-disabled="true"]):hover::before {
  transform: scaleX(1);
  transition: transform 240ms steps(6);
}

html:not(.motion-on) .btn-primary:not([aria-disabled="true"]):hover::before {
  transform: scaleX(1);
}

.btn-primary:not([aria-disabled="true"]):hover {
  color: var(--paper);
}

.btn-primary > span {
  position: relative;
  z-index: 1;
}

.btn-primary:not([aria-disabled="true"]):active {
  transform: translateY(1px);
}

.btn-primary[aria-disabled="true"],
.btn-stepper[aria-disabled="true"] {
  background-color: transparent;
  color: var(--btn-disabled-fg, var(--ink));
  border: 1px solid var(--btn-disabled-border, var(--ink));
  cursor: not-allowed;
}

.btn-strike {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  pointer-events: none;
  z-index: 0;
}

/* Toggle chips */
.chip-toggle {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  height: 32px;
  padding: 0 12px;
  border: 1px solid var(--chip-border, var(--ink));
  background-color: transparent;
  color: var(--chip-fg, var(--ink));
  font-weight: 500;
  white-space: nowrap;
}

@media (pointer: coarse) {
  .chip-toggle, .btn-text, .nav-link, .menu-btn, .pager-btn {
    min-height: 44px;
    min-width: 44px;
  }
  .chip-toggle {
    height: 44px;
  }
}

.chip-toggle[aria-pressed="true"] {
  background-color: var(--chip-active-bg, var(--ink));
  color: var(--chip-active-fg, var(--paper));
}

.chip-toggle[data-track="film"][aria-pressed="true"] {
  background-color: var(--blue);
  color: var(--paper);
  border-color: var(--ink);
}

.chip-toggle[data-track="panel"][aria-pressed="true"] {
  background-color: var(--pink);
  color: var(--ink);
  border-color: var(--ink);
}

.chip-toggle[data-track="live"][aria-pressed="true"] {
  background-color: var(--green);
  color: var(--paper);
  border-color: var(--ink);
}

.chip-toggle[data-track="fashion"][aria-pressed="true"] {
  background-color: var(--lavender);
  color: var(--ink);
  border-color: var(--ink);
}

.seg-group {
  display: inline-flex;
}

.seg-group > .chip-toggle + .chip-toggle {
  margin-left: -1px;
}

/* Track chips (static badges) */
.track-chip {
  display: inline-block;
  padding: 1px 6px;
  font-weight: 600;
  vertical-align: baseline;
}

.track-chip-film { background-color: var(--blue); color: var(--paper); }
.track-chip-panel { background-color: var(--pink); color: var(--ink); }
.track-chip-live { background-color: var(--green); color: var(--paper); }
.track-chip-fashion { background-color: var(--lavender); color: var(--ink); }

.clash-chip {
  display: inline-block;
  padding: 2px 6px;
  background-color: var(--coral);
  color: var(--ink);
  font-weight: 600;
}

/* Mobile menu overlay */
.menu-overlay {
  position: fixed;
  inset: 0;
  z-index: 90;
  background-color: var(--sodium);
  color: var(--ink);
  display: none;
  flex-direction: column;
  padding-bottom: var(--s6);
  overflow-y: auto;
}

.menu-overlay.is-open {
  display: flex;
}

.menu-overlay-top {
  height: var(--header-h);
  display: flex;
  align-items: center;
  flex-shrink: 0;
}

.menu-overlay-links {
  margin-top: var(--s5);
  display: flex;
  flex-direction: column;
  gap: var(--s3);
}

.menu-overlay-links a {
  display: inline-block;
  padding: var(--s1) 0;
  align-self: flex-start;
}

.menu-overlay-links a[aria-current="page"] {
  background-color: var(--ink);
  color: var(--sodium);
  padding: var(--s1) var(--s2);
}

.menu-overlay-footer {
  margin-top: auto;
  padding-top: var(--s6);
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: var(--s4);
}

/* Global pixel overlays */
#trail-canvas {
  position: fixed;
  inset: 0;
  width: 100%;
  height: 100%;
  pointer-events: none;
  z-index: 30;
}

#wipe-canvas {
  position: fixed;
  inset: 0;
  width: 100%;
  height: 100%;
  pointer-events: none;
  z-index: 120;
  display: none;
}

#wipe-canvas.is-active {
  display: block;
}

/* Shared tooltip */
#tip {
  position: fixed;
  z-index: 100;
  background-color: var(--paper);
  color: var(--ink);
  border: 1px solid var(--ink);
  padding: 4px 8px;
  pointer-events: none;
  display: none;
  max-width: 260px;
}

#tip.is-visible {
  display: block;
}

/* Section pager & top button */
.pager-wrap {
  position: fixed;
  left: var(--margin);
  bottom: var(--s3);
  z-index: 40;
}

.pager-wrap.is-hidden {
  display: none;
}

.pager-btn {
  padding: 4px 6px;
  background-color: transparent;
  border: 1px solid transparent;
  min-height: 24px;
  min-width: 24px;
}

.pager-wrap[data-surface="ink"] {
  color: var(--sodium);
  --focus: var(--sodium);
}

.pager-wrap[data-surface="sodium"],
.pager-wrap[data-surface="paper"] {
  color: var(--ink);
  --focus: var(--ink);
}

.pager-popover {
  position: absolute;
  left: 0;
  bottom: calc(100% + 8px);
  background-color: var(--paper);
  color: var(--ink);
  border: 1px solid var(--ink);
  padding: var(--s2);
  min-width: 200px;
  display: none;
}

.pager-popover.is-open {
  display: block;
}

.pager-popover button {
  display: block;
  width: 100%;
  text-align: left;
  padding: 6px 8px;
  min-height: 32px;
}

.pager-popover button:hover,
.pager-popover button[aria-current="true"] {
  background-color: var(--ink);
  color: var(--sodium);
}

.top-btn {
  position: fixed;
  right: var(--margin);
  bottom: var(--s3);
  z-index: 40;
  padding: 4px 6px;
  display: none;
  min-height: 24px;
  min-width: 24px;
}

.top-btn.is-visible {
  display: inline-flex;
  align-items: center;
}

.top-btn[data-surface="ink"] {
  color: var(--sodium);
  --focus: var(--sodium);
}

.top-btn[data-surface="sodium"],
.top-btn[data-surface="paper"] {
  color: var(--ink);
  --focus: var(--ink);
}

/* Reveal animations */
@keyframes revealTextClip {
  from { clip-path: inset(0 100% 0 0); }
  to { clip-path: inset(0 0 0 0); }
}

.reveal-text.is-pending {
  opacity: 0;
}

.reveal-text.is-shown {
  opacity: 1;
  animation: revealTextClip 320ms steps(8) both;
}

.reveal-block.is-pending {
  opacity: 0;
  transform: translateY(8px);
}

.reveal-block.is-shown {
  opacity: 1;
  transform: translateY(0);
  transition: opacity 240ms steps(4), transform 240ms steps(4);
}

/* L1 Hero */
.hero-sec {
  padding-inline: var(--margin);
  padding-top: var(--s4);
  padding-bottom: var(--s6);
}

.hero-sec[data-surface="ink"] .hero-top-address,
.hero-sec[data-surface="ink"] .hero-split-wrap {
  color: var(--text-strong);
}

.hero-sec[data-surface="ink"] .hero-final-wrap {
  color: var(--accent-highlight);
}

.hero-sec[data-surface="ink"] .hero-canvas {
  border: 1px solid var(--border-subtle-dark);
}

#tracks[data-surface="ink"] {
  border-top: 1px solid var(--border-subtle-dark);
}

@media (min-width: 1024px) {
  .hero-sec {
    min-height: calc(100svh - var(--header-h));

    flex-direction: column;
    justify-content: space-between;
  }
}

.hero-top-address {
  grid-column: 1 / 4;
}

.hero-top-about {
  grid-column: 3 / 4;
  justify-self: start;
  align-self: start;
}

.hero-top-date {
  grid-column: 4 / 5;
  justify-self: end;
  align-self: start;
  text-align: right;
}

@media (max-width: 767px) {

  .hero-top-about { grid-column: 1 / 3; }
  .hero-top-date { grid-column: 3 / 5; }
}

@media (min-width: 768px) {
  .hero-top-address { grid-column: 1 / 4; }
  .hero-top-about { grid-column: 4 / 6; }
  .hero-top-date { grid-column: 7 / 9; }
}

@media (min-width: 1024px) {
  .hero-top-address { grid-column: 1 / 5; }
  .hero-top-about { grid-column: 6 / 7; }
  .hero-top-date { grid-column: 10 / 13; }
}

.hero-display-wrap {
  margin-top: var(--s6);
}

.hero-canvas {

  width: 100%;
  aspect-ratio: 31 / 16;
  cursor: pointer;
}

@media (min-width: 768px) {

  }
}

.hero-sub-row {

}

.hero-caption {

}

.hero-times {

@media (min-width: 768px) {

  .hero-times { grid-column: 3 / 5; }
}

@media (min-width: 1024px) {

}

.hero-bottom-row {

}

.hero-intro-label {
  grid-column: 1 / -1;
  margin-bottom: var(--s2);
}

.hero-split-wrap {
  grid-column: 1 / -1;
}

.hero-final-wrap {
  grid-column: 1 / -1;
  margin-top: var(--s2);
}

@media (min-width: 768px) {
  .hero-intro-label {
    grid-column: 1 / 3;
    margin-bottom: 0;
  }
  .hero-split-wrap {
    grid-column: 3 / 9;
  }
  .hero-final-wrap {
    grid-column: 5 / 9;
    text-align: right;
    margin-top: 0;
  }
}

@media (min-width: 1024px) {

    grid-column: 2 / 4;
  }
  .hero-split-wrap {
    grid-column: 4 / 13;
  }
  .hero-final-wrap {
    grid-column: 9 / 13;

  }
}

.split-line {

}

@media (min-width: 768px) {

@media (min-width: 1024px) {

.stats-items {

  }
}

.stat-svg {

  max-width: 100%;

}

.stat-label {
  margin-top: var(--s2);
}

.countdown-block {
  margin-top: var(--s7);
}

.countdown-row {
  margin-top: var(--s3);

  flex-wrap: wrap;
  gap: var(--s3) 0;

}

.cd-pair {

}

.cd-group {

}

.cd-group-label {

@media (min-width: 768px) {

@media (min-width: 1024px) {

  outline-offset: 4px;
}

#tracks-grid .track-panel-btn:active {
  transform: translateY(2px);
}

#tracks-grid .track-panel-svg {
  display: block;
  width: 100%;
  height: auto;
  flex-shrink: 0;
}

#tracks-grid .track-card-body {

@media (min-width: 1024px) {

#tracks-grid .track-card-title {
  font-size: clamp(1.25rem, 1.05rem + 0.85vw, 1.75rem);

  line-height: 1.08;
  letter-spacing: -0.025em;
  color: inherit;
}

#tracks-grid .track-card-desc {
  margin-top: var(--s2);

}

#tracks-grid .track-card-foot {

.day-col {

.day-session-list {

}

.day-session-row {

  border-bottom: var(--rule);

.day-session-row:hover {

.day-session-row[data-track="film"]:hover { --hover-bg: var(--blue); --hover-fg: var(--paper); }
.day-session-row[data-track="panel"]:hover { --hover-bg: var(--pink); --hover-fg: var(--ink); }
.day-session-row[data-track="live"]:hover { --hover-bg: var(--green); --hover-fg: var(--paper); }
.day-session-row[data-track="fashion"]:hover { --hover-bg: var(--lavender); --hover-fg: var(--ink); }

.day-session-title {
  margin-top: var(--s1);

}

.day-session-meta {

.day-col-footer {

  gap: var(--s4) var(--gutter);
}

@media (min-width: 768px) {

    grid-template-columns: repeat(3, minmax(0, 1fr));

@media (min-width: 1024px) {

  }
}

.speakers-index-grid {
  margin-top: var(--s6);

  grid-template-columns: repeat(2, minmax(0, 1fr));

@media (min-width: 1024px) {

.schedule-mobile-list {
  display: flex;
  flex-direction: column;
  gap: var(--s2);
  margin-top: var(--s3);
}

.schedule-empty {
  padding: var(--s7) 0;
  display: flex;
  flex-direction: column;
  align-items: flex-start;
  gap: var(--s3);
}

/* Tables */
.data-table {
  width: 100%;
  border-collapse: collapse;
  margin-top: var(--s4);
}

.data-table caption {
  text-align: left;
  padding-bottom: var(--s2);
}

.data-table th {
  text-align: left;
  padding: 12px 8px;
  border-bottom: var(--rule-strong);
  font-weight: 600;
  vertical-align: bottom;
}

.data-table td {
  padding: 12px 8px;
  border-bottom: var(--rule);
  vertical-align: top;
}

.data-table th.num, .data-table td.num {
  text-align: right;
}

.talk-row:hover td {
  background-color: var(--hover-bg, transparent);
  color: var(--hover-fg, var(--ink));
}

.talk-row[data-track="film"]:hover td { --hover-bg: var(--blue); --hover-fg: var(--paper); }
.talk-row[data-track="panel"]:hover td { --hover-bg: var(--pink); --hover-fg: var(--ink); }
.talk-row[data-track="live"]:hover td { --hover-bg: var(--green); --hover-fg: var(--paper); }
.talk-row[data-track="fashion"]:hover td { --hover-bg: var(--lavender); --hover-fg: var(--ink); }

.talk-expand-row td {
  padding: var(--s4) var(--s3);
  border-bottom: var(--rule-strong);
  background-color: var(--paper);
}

@media (max-width: 1023px) and (min-width: 768px) {
  .talks-table .col-speakers {
    display: none;
  }
}

@media (max-width: 767px) {
  .responsive-table,
  .responsive-table tbody,
  .responsive-table tr,
  .responsive-table td {
    display: block;
    width: 100%;
  }
  .responsive-table thead {
    position: absolute;
    width: 1px;
    height: 1px;
    overflow: hidden;
    clip: rect(0 0 0 0);
  }
  .responsive-table tr {
    border-bottom: var(--rule-strong);
    padding-block: var(--s2);
  }
  .responsive-table td {
    border-bottom: 0;
    padding: 6px 0;
  }
  .responsive-table td::before {
    content: attr(data-label);
    display: block;
    font-size: 0.75rem;
    font-weight: 600;
    margin-bottom: 2px;
  }
  .responsive-table td.num {
    text-align: left;
  }
}

.sort-btn {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  min-height: 24px;
  font-weight: 600;
}

.talks-controls {
  margin-top: var(--s5);
  display: flex;
  flex-direction: column;
  gap: var(--s3);
}

.talks-search-row {
  display: flex;
  flex-wrap: wrap;
  align-items: flex-end;
  gap: var(--s3);
}

.field-group {
  display: flex;
  flex-direction: column;
  gap: var(--s1);
}

.text-input, .select-input {
  height: 44px;
  padding: 0 12px;
  border: 1px solid var(--input-border, var(--ink));
  background-color: var(--input-bg, var(--paper));
  color: var(--input-fg, var(--ink));
  font-size: 1rem;
}

mark {
  background-color: var(--sodium);
  color: var(--ink);
  font-weight: 600;
  padding: 0 2px;
}

/* Speaker detail */
.scrubber-wrap {
  margin-top: var(--s3);
  display: flex;
  flex-direction: column;
  gap: var(--s2);
}

.scrubber-head {
  display: flex;
  justify-content: space-between;
  align-items: center;
}

.scrubber-input {
  width: 100%;
  accent-color: var(--ink);
  height: 32px;
}

.speaker-sessions-list {
  margin-top: var(--s5);
  border-top: var(--rule);
}

.speaker-session-item {
  padding-block: var(--s4);
  border-bottom: var(--rule);
  display: flex;
  flex-direction: column;
  gap: var(--s2);
}

.speaker-prev-next {
  margin-top: var(--s7);
  padding-top: var(--s4);
  border-top: var(--rule);
  display: flex;
  flex-wrap: wrap;
  justify-content: space-between;
  gap: var(--s3);
}

/* Venue */
.venue-grid {
  margin-top: var(--s6);
  row-gap: var(--s5);
}

.venue-svg {
  display: block;
  width: 100%;
  height: auto;
}

.venue-room-shape {
  cursor: pointer;
}

.venue-room-list {
  display: flex;
  flex-direction: column;
  border-top: var(--rule);
}

.venue-room-btn {
  width: 100%;
  text-align: left;
  padding: 12px 8px;
  border-bottom: var(--rule);
  min-height: 44px;
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: var(--s2);
}

.venue-room-btn[aria-pressed="true"] {
  background-color: var(--ink);
  color: var(--sodium);
}

.venue-details {
  margin-top: var(--s4);
  padding: var(--s3);
  border: var(--rule);
}

.venue-info-cols {
  margin-top: var(--s7);
  row-gap: var(--s5);
}

.access-list {
  margin-top: var(--s3);
  display: flex;
  flex-direction: column;
  gap: var(--s2);
}

.access-list li {
  padding-left: var(--s3);
  position: relative;
}

.access-list li::before {
  content: "";
  position: absolute;
  left: 0;
  top: 0.55em;
  width: 6px;
  height: 6px;
  background-color: var(--ink);
}

/* Passes */
.tier-list {
  margin-top: var(--s6);
  border-bottom: var(--rule);
}

.tier-row {
  border-top: var(--rule);
  padding-block: var(--s4);
  align-items: center;
  row-gap: var(--s3);
}

.tier-name-col { grid-column: 1 / -1; }
.tier-inc-col { grid-column: 1 / -1; }
.tier-price-col { grid-column: 1 / 3; }
.tier-step-col { grid-column: 3 / 5; justify-self: end; }

@media (min-width: 768px) and (max-width: 1023px) {
  .tier-name-col { grid-column: 1 / 6; }
  .tier-price-col { grid-column: 6 / 9; text-align: right; }
  .tier-inc-col { grid-column: 1 / 9; }
  .tier-step-col { grid-column: 1 / 9; justify-self: start; }
}

@media (min-width: 1024px) {
  .tier-name-col { grid-column: 1 / 5; }
  .tier-inc-col { grid-column: 5 / 9; }
  .tier-price-col { grid-column: 9 / 11; text-align: right; }
  .tier-step-col { grid-column: 11 / 13; justify-self: end; }
}

.stepper {
  display: inline-flex;
  align-items: center;
  gap: var(--s2);
}

.btn-stepper {
  position: relative;
  width: 44px;
  height: 44px;
  border: 1px solid var(--ink);
  display: inline-flex;
  align-items: center;
  justify-content: center;
  background-color: transparent;
}

.stepper-val {
  min-width: 24px;
  text-align: center;
  font-weight: 600;
}

.day-select-wrap {
  margin-top: var(--s3);
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: var(--s2);
}

.error-chip {
  background-color: var(--coral);
  color: var(--ink);
  padding: 4px 8px;
  font-weight: 600;
}

.passes-total-row {
  margin-top: var(--s5);
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  justify-content: space-between;
  gap: var(--s4);
}

.faq-sec {
  margin-top: var(--s8);
}

.faq-list {
  margin-top: var(--s4);
  border-bottom: var(--rule);
}

.faq-item {
  border-top: var(--rule);
}

.faq-summary {
  min-height: 64px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: var(--s3);
  cursor: pointer;
  list-style: none;
  padding-block: var(--s3);
}

.faq-summary::-webkit-details-marker {
  display: none;
}

.faq-icon-minus {
  display: none;
}

details[open] .faq-icon-plus {
  display: none;
}

details[open] .faq-icon-minus {
  display: block;
}

.faq-answer {
  padding-bottom: var(--s4);
}

/* Native dialog */
dialog.raster-dialog {
  background-color: var(--paper);
  color: var(--ink);
  border: 2px solid var(--ink);
  padding: var(--s5);
  max-width: 520px;
  width: calc(100% - 32px);
}

dialog.raster-dialog::backdrop {
  background-color: var(--ink);
  opacity: 0.85;
}

/* Badge maker */
.badge-layout {
  margin-top: var(--s5);
  row-gap: var(--s5);
}

.badge-editor-canvas {
  display: block;
  width: 100%;
  max-width: 640px;
  aspect-ratio: 1 / 1;
  cursor: crosshair;
  touch-action: none;
  border: 1px solid var(--sodium);
}

.badge-status {
  margin-top: var(--s2);
  min-height: 20px;
}

.palette-group {
  margin-top: var(--s4);
  display: flex;
  flex-wrap: wrap;
  gap: var(--s2);
}

.palette-swatch {
  width: 44px;
  height: 44px;
  border: 1px solid var(--sodium);
  position: relative;
}

.palette-swatch[aria-checked="true"] {
  outline: 3px solid var(--sodium);
  outline-offset: 2px;
}

.badge-tools {
  margin-top: var(--s4);
  display: flex;
  flex-wrap: wrap;
  gap: var(--s2);
}

.badge-preview-svg {
  display: block;
  width: 100%;
  max-width: 480px;
  height: auto;
  aspect-ratio: 2 / 3;
  border: 1px solid var(--sodium);
}

.badge-name-field {
  margin-top: var(--s4);
  max-width: 480px;
}

.badge-dl-wrap {
  margin-top: var(--s4);
}

/* Footer */
.site-footer {
  padding-top: var(--s8);
}

.footer-logo-svg {
  display: block;
  width: 100%;
  height: auto;
}

.footer-cols {
  margin-top: var(--s6);
  row-gap: var(--s5);
}

.footer-block {
  grid-column: 1 / -1;
}

@media (min-width: 768px) {
  .footer-block {
    grid-column: span 4;
  }
}

@media (min-width: 1024px) {
  .footer-block {
    grid-column: span 3;
  }
}

.footer-block-head {
  margin-bottom: var(--s2);
}

.footer-nav-list {
  display: flex;
  flex-direction: column;
  gap: 4px;
}

.footer-bottom {
  margin-top: var(--s7);
  padding-bottom: var(--s5);
  row-gap: var(--s3);
  align-items: end;
}

.footer-honesty {
  grid-column: 1 / -1;
}

.footer-ver {
  grid-column: 1 / -1;
}

@media (min-width: 1024px) {
  .footer-honesty {
    grid-column: 1 / 9;
  }
  .footer-ver {
    grid-column: 10 / 13;
    text-align: right;
  }
}

.footer-staircase {
  display: block;
  width: 100%;
  height: 8px;
}

/* 404 */
.notfound-bitmap {
  display: block;
  max-width: 100%;
  height: auto;
  margin-bottom: var(--s5);
}

/* Agenda reminder settings panel & global alert banner */
.reminders-panel {
  background-color: var(--paper);
  color: var(--ink);
  border-bottom: var(--rule-strong);
  padding-block: var(--s4);
  display: none;
}

.reminders-panel.is-open {
  display: block;
}

.reminders-panel-grid {
  display: grid;
  grid-template-columns: 1fr;
  gap: var(--s4);
  align-items: start;
}

@media (min-width: 768px) {
  .reminders-panel-grid {
    grid-template-columns: repeat(2, minmax(0, 1fr));
  }
}

@media (min-width: 1024px) {
  .reminders-panel-grid {
    grid-template-columns: 1.1fr 1.1fr 1.4fr;
  }
}

.reminders-field-row {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: var(--s2);
  margin-top: var(--s2);
}

.reminders-min-input {
  width: 88px;
}

.reminders-note-input {
  width: 100%;
  margin-top: var(--s2);
}

.reminders-status-meta {
  margin-top: var(--s2);
  color: var(--ink);
}

.reminders-armed-list {
  margin-top: var(--s2);
  border-top: var(--rule);
}

.reminders-armed-item {
  padding: var(--s2) 0;
  border-bottom: var(--rule);
  display: flex;
  justify-content: space-between;
  gap: var(--s3);
}

.reminder-banner {
  position: fixed;
  right: var(--margin);
  bottom: calc(var(--s6) + var(--s2));
  z-index: 110;
  width: min(440px, calc(100vw - (var(--margin) * 2)));
  background-color: var(--ink);
  color: var(--paper);
  border: 2px solid var(--lavender);
  padding: var(--s3) var(--s4);
  display: none;
}

.reminder-banner.is-visible {
  display: block;
}

.reminder-banner-head {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: var(--s2);
  color: var(--lavender);
}

.reminder-banner-actions {
  margin-top: var(--s3);
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  justify-content: space-between;
  gap: var(--s3);
}

/* Ticket QR scanner overlay */
.tickets-action-group {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: var(--s3);
}

.btn-secondary {
  position: relative;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: var(--s2);
  height: 48px;
  padding: 0 20px;
  border: 2px solid var(--ink);
  background-color: var(--paper);
  color: var(--ink);
  font-weight: 600;
  white-space: nowrap;
}

.btn-secondary:hover {
  background-color: var(--ink);
  color: var(--sodium);
}

dialog.raster-dialog.qr-dialog {
  max-width: 680px;
  max-height: calc(100svh - 32px);
  overflow-y: auto;
  padding: var(--s4);
}

@media (min-width: 768px) {
  dialog.raster-dialog.qr-dialog {
    padding: var(--s5);
  }
}

.qr-dialog-head {
  display: flex;
  align-items: flex-start;
  justify-content: space-between;
  gap: var(--s3);
  padding-bottom: var(--s3);
  border-bottom: var(--rule);
}

.qr-tabs {
  margin-top: var(--s4);
  display: flex;
  flex-wrap: wrap;
}

.qr-panel {
  margin-top: var(--s4);
}

.qr-viewport {
  position: relative;
  width: 100%;
  aspect-ratio: 4 / 3;
  max-height: 300px;
  background-color: var(--ink);
  color: var(--paper);
  border: 2px solid var(--ink);
  overflow: hidden;
  display: flex;
  align-items: center;
  justify-content: center;
}

.qr-video {
  width: 100%;
  height: 100%;
  object-fit: cover;
  display: block;
}

.qr-reticle {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  pointer-events: none;
}

.qr-camera-msg {
  position: absolute;
  inset: 0;
  z-index: 3;
  padding: var(--s4);
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  text-align: center;
  gap: var(--s3);
  background-color: var(--ink);
  color: var(--sodium);
}

.qr-camera-msg[hidden] {
  display: none;
}

.qr-orient-tip {
  position: relative;
  margin-top: 10px;
  background-color: var(--ink);
  color: var(--paper);
  border: 2px solid var(--accent-highlight);
  padding: 10px 12px;
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  justify-content: space-between;
  gap: 8px 12px;
}

.qr-orient-tip[hidden] {
  display: none;
}

.qr-orient-tip-body {
  flex: 1 1 220px;
  min-width: 0;
}

.qr-orient-tip-kicker {
  color: var(--accent-highlight);
  font-weight: 600;
  margin-bottom: 2px;
}

.qr-orient-dismiss {
  --chip-border: var(--paper);
  --chip-fg: var(--ink);
  --chip-active-bg: var(--accent-highlight);
  --chip-active-fg: var(--ink);
  background-color: var(--paper);
  color: var(--ink);
  flex-shrink: 0;
}

.qr-upload-zone {
  border: 2px dashed var(--ink);
  padding: var(--s4);
  background-color: var(--paper);
  display: flex;
  flex-direction: column;
  align-items: flex-start;
  gap: var(--s3);
}

.qr-upload-zone.is-dragover {
  background-color: var(--sodium);
}

.qr-upload-preview {
  max-width: 160px;
  max-height: 160px;
  border: 1px solid var(--ink);
  display: none;
}

.qr-upload-preview.is-visible {
  display: block;
}

.qr-manual-row {
  display: flex;
  flex-wrap: wrap;
  gap: var(--s2);
  align-items: stretch;
}

.qr-manual-row .text-input {
  flex: 1 1 240px;
  min-width: 0;
}

.qr-samples-row {
  margin-top: var(--s3);
  display: flex;
  flex-wrap: wrap;
  gap: var(--s2);
}

.qr-api-details {
  margin-top: var(--s4);
  border-top: var(--rule);
  padding-top: var(--s3);
}

.qr-api-details summary {
  cursor: pointer;
  font-weight: 600;
  min-height: 36px;
  display: flex;
  align-items: center;
  justify-content: space-between;
}

.qr-result-box {
  margin-top: var(--s4);
  border: 2px solid var(--ink);
  padding: var(--s4);
  background-color: var(--paper);
  color: var(--ink);
}

.qr-result-box[data-status="valid"] {
  background-color: var(--status-valid-bg);
  color: var(--status-valid-fg);
  border-color: var(--status-valid-accent);
  --rule-color: var(--border-subtle-dark);
  --rule: 1px solid var(--border-subtle-dark);
  --focus: var(--status-valid-accent);
}

.qr-result-box[data-status="valid"] #qr-res-kicker {
  color: var(--status-valid-accent);
  font-weight: 600;
}

.qr-result-box[data-status="valid"] .btn-primary {
  background-color: var(--status-valid-accent);
  color: var(--ramp-ink-950);
}

.qr-result-box[data-status="valid"] .btn-primary:not([aria-disabled="true"]):hover {
  color: var(--paper);
}

.qr-result-box[data-status="checked_in"] {
  background-color: var(--status-warn-bg);
  color: var(--status-warn-fg);
}

.qr-result-box[data-status="invalid"] {
  background-color: var(--status-error-bg);
  color: var(--status-error-fg);
  --rule-color: var(--paper);
  --rule: 1px solid var(--paper);
  --focus: var(--paper);
}

.qr-result-box[data-status="checking"] {
  background-color: var(--status-checking-bg);
  color: var(--status-checking-fg);
}

.qr-result-meta {
  margin-top: var(--s2);
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
  gap: var(--s2) var(--s4);
  padding-top: var(--s2);
  border-top: var(--rule);
}

.qr-result-actions {
  margin-top: var(--s3);
  display: flex;
  flex-wrap: wrap;
  gap: var(--s2);
  align-items: center;
}

.qr-history-wrap {
  margin-top: var(--s4);
  padding-top: var(--s3);
  border-top: var(--rule);
}

.qr-history-list {
  margin-top: var(--s2);
  border-top: var(--rule);
}

.qr-history-item {
  padding: 8px 0;
  border-bottom: var(--rule);
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  justify-content: space-between;
  gap: var(--s2);
}

.qr-history-meta {
  display: inline-flex;
  align-items: center;
  flex-wrap: wrap;
  gap: 6px 10px;
}

.qr-history-duration {
  padding: 1px 6px;
  border: 1px solid var(--ink);
  background-color: var(--accent-highlight);
  color: var(--ink);
  font-weight: 600;
}

.qr-dialog-controls {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  justify-content: flex-end;
  gap: var(--s2) var(--s3);
}

.qr-volume-control {
  display: inline-flex;
  align-items: center;
  gap: 8px;
  min-height: 36px;
  padding: 4px 10px;
  border: 1px solid var(--ink);
  background-color: var(--paper);
  color: var(--ink);
}

.qr-volume-slider {
  width: 84px;
  accent-color: var(--ink);
  cursor: pointer;
  margin: 0;
}

.qr-haptic-note {
  margin-top: var(--s2);
  color: var(--text-muted-on-paper);
}

.adinkra-divider {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 16px;
  padding: 14px var(--margin);
  background-color: var(--surface-obsidian);
  border-top: 2px solid var(--accent-highlight);
  border-bottom: 2px solid var(--accent-highlight);
  color: var(--accent-highlight);
  overflow: hidden;
}

.adinkra-divider-pattern {
  display: inline-flex;
  gap: 16px;
  align-items: center;
  font-family: monospace;
  font-size: 11px;
  letter-spacing: 2px;
  text-transform: uppercase;
  white-space: nowrap;
}

.adinkra-stamp-row {
  margin-top: 12px;
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
}

.adinkra-gallery-dialog {
  width: min(680px, calc(100vw - 32px));
  max-height: 85vh;
  padding: var(--s5);
  background-color: var(--paper);
  color: var(--ink);
  border: 3px solid var(--ink);
}

.adinkra-gallery-grid {
  margin-top: var(--s4);
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
  gap: var(--s3);
  max-height: 420px;
  overflow-y: auto;
  padding-right: 4px;
}

.adinkra-card {
  position: relative;
  border: 2px solid var(--ink);
  padding: var(--s3);
  background-color: var(--paper);
  display: flex;
  flex-direction: column;
  gap: 8px;
  cursor: pointer;
  transition: background-color 0.15s ease, transform 0.15s ease;
  text-align: left;
}

.adinkra-card:hover {
  background-color: var(--sodium);
  transform: translateY(-1px);
}

.adinkra-card-top {
  display: flex;
  justify-content: space-between;
  align-items: flex-start;
  gap: 12px;
}

.adinkra-name-wrap {
  position: relative;
  cursor: help;
}

.adinkra-card-preview {
  width: 52px;
  height: 52px;
  border: 1px solid var(--ink);
  background-color: var(--ink);
  display: grid;
  grid-template-columns: repeat(16, 1fr);
  grid-template-rows: repeat(16, 1fr);
  flex-shrink: 0;
  position: relative;
  cursor: help;
}

.adinkra-tooltip {
  position: absolute;
  top: calc(100% + 8px);
  left: 0;
  background-color: var(--surface-obsidian);
  color: var(--paper);
  border: 2px solid var(--accent-highlight);
  padding: 6px 10px;
  font-size: 11px;
  line-height: 1.35;
  width: max-content;
  max-width: 240px;
  box-shadow: 0 4px 16px rgba(0, 0, 0, 0.45);
  pointer-events: none;
  opacity: 0;
  visibility: hidden;
  transform: translateY(-4px);
  transition: opacity 0.15s ease, transform 0.15s ease, visibility 0.15s ease;
  z-index: 50;
  white-space: normal;
  text-align: left;
}

.adinkra-tooltip-preview {
  left: auto;
  right: 0;
}

.adinkra-tooltip-kicker {
  display: block;
  font-weight: 700;
  text-transform: uppercase;
  letter-spacing: 0.5px;
  font-size: 10px;
  color: var(--accent-highlight);
  margin-bottom: 2px;
}

.adinkra-tooltip-text {
  display: block;
  color: var(--paper);
}

.adinkra-tooltip::before {
  content: "";
  position: absolute;
  bottom: 100%;
  left: 16px;
  border: 5px solid transparent;
  border-bottom-color: var(--accent-highlight);
}

.adinkra-tooltip-preview::before {
  left: auto;
  right: 18px;
}

.adinkra-name-wrap:hover .adinkra-tooltip,
.adinkra-name-wrap:focus-within .adinkra-tooltip,
.adinkra-card-preview:hover .adinkra-tooltip,
.adinkra-card-preview:focus-within .adinkra-tooltip {
  opacity: 1;
  visibility: visible;
  transform: translateY(0);
}

.adinkra-filter-row {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
  margin-top: var(--s3);
}

.qr-summary-card {
  margin-top: var(--s4);
  border: 2px solid var(--ink);
  padding: var(--s3) var(--s4);
  background-color: var(--paper);
  color: var(--ink);
}

.qr-summary-head {
  display: flex;
  flex-wrap: wrap;
  align-items: baseline;
  justify-content: space-between;
  gap: var(--s2) var(--s3);
}

.qr-summary-total-row {
  margin-top: var(--s2);
  display: flex;
  flex-wrap: wrap;
  align-items: baseline;
  justify-content: space-between;
  gap: var(--s2);
  padding-bottom: var(--s2);
  border-bottom: var(--rule-strong);
}

.qr-summary-tiers {
  margin-top: var(--s2);
  display: grid;
  grid-template-columns: 1fr;
  column-gap: var(--s4);
}

@media (min-width: 540px) {
  .qr-summary-tiers {
    grid-template-columns: repeat(2, minmax(0, 1fr));
  }
}

.qr-summary-tier-row {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: var(--s2);
  padding: 6px 0;
  border-bottom: var(--rule);
}

  function storageGet(key, fallback) {
    try {
      const raw = window.localStorage.getItem(key);

  function hashStr(s) {
    let h = 2166136261;
    for (let i = 0; i < s.length; i++) {
      h ^= s.charCodeAt(i);
      h = Math.imul(h, 16777619);
    }
    return h >>> 0;
  }

  function makeRng(seed) {
    let a = seed >>> 0;
    return function () {
      a |= 0;
      a = (a + 0x6D2B79F5) | 0;
      let t = Math.imul(a ^ (a >>> 15), 1 | a);
      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }

  function cubicBezier(x1, y1, x2, y2) {
    return function (t) {
      if (t <= 0) return 0;
      if (t >= 1) return 1;
      let lo = 0, hi = 1, u = t;
      for (let i = 0; i < 12; i++) {
        u = (lo + hi) * 0.5;
        const mu = 1 - u;
        const x = 3 * mu * mu * u * x1 + 3 * mu * u * u * x2 + u * u * u;
        if (x < t) lo = u;
        else hi = u;
      }
      const mu = 1 - u;
      return 3 * mu * mu * u * y1 + 3 * mu * u * u * y2 + u * u * u;

    scannerHaptics: storageGet("afj5.scannerHaptics", true),
    scannerVolume: storageGet("afj5.scannerVolume", 70),
    dailyScans: storageGet("afj5.dailyScans", null),
    routeCleanup: []
  };

  function getTodayLocalKey() {
    const d = new Date();
    const y = d.getFullYear();
    const m = String(d.getMonth() + 1).padStart(2, "0");
    const day = String(d.getDate()).padStart(2, "0");
    return `${y}-${m}-${day}`;
  }

  function ensureTodayDailyScans() {
    const today = getTodayLocalKey();
    if (!state.dailyScans || typeof state.dailyScans !== "object" || state.dailyScans.date !== today || !state.dailyScans.entries || typeof state.dailyScans.entries !== "object") {
      state.dailyScans = { date: today, entries: {} };
    }
    return state.dailyScans;
  }

  if (!Array.isArray(state.agenda)) state.agenda = [];
  if (!Array.isArray(state.filters.tracks)) state.filters.tracks = [];
  if (!["d1", "d2", "d3"].includes(state.filters.day)) state.filters.day = "d1";
  if (!["timeline", "table"].includes(state.filters.view)) state.filters.view = "timeline";
  if (typeof state.badge.grid !== "string" || state.badge.grid.length !== 256) {
    state.badge.grid = defaultBadgeGrid();
  }
  if (typeof state.badge.name !== "string") state.badge.name = "AFJ Guest";
  if (typeof state.reminders.enabled !== "boolean") state.reminders.enabled = false;
  if (!Number.isFinite(Number(state.reminders.minutesBefore)) || Number(state.reminders.minutesBefore) < 1) {
    state.reminders.minutesBefore = 15;
  } else {
    state.reminders.minutesBefore = Math.min(180, Math.max(1, Math.round(Number(state.reminders.minutesBefore))));
  }
  if (typeof state.reminders.customNote !== "string") state.reminders.customNote = "";
  if (!state.reminders.fired || typeof state.reminders.fired !== "object") state.reminders.fired = {};
  if (!Array.isArray(state.checkins)) state.checkins = [];
  if (typeof state.scannerApiUrl !== "string") state.scannerApiUrl = "";
  state.scannerHaptics = state.scannerHaptics !== false;
  if (!Number.isFinite(Number(state.scannerVolume))) {
    state.scannerVolume = 70;
  } else {
    state.scannerVolume = Math.min(100, Math.max(0, Math.round(Number(state.scannerVolume))));
  }
  ensureTodayDailyScans();

  function toggleAgenda(sessionId) {
    const idx = state.agenda.indexOf(sessionId);
    if (idx === -1) state.agenda.push(sessionId);
    else state.agenda.splice(idx, 1);
    storageSet("afj5.agenda", state.agenda);
    window.dispatchEvent(new CustomEvent("afj:agendachange"));
  }

  function hasClash(session) {
    if (!state.agenda.includes(session.id)) return false;
    const sStart = timeToMin(session.start);
    const sEnd = timeToMin(session.end);
    return state.agenda.some(otherId => {
      if (otherId === session.id) return false;
      const o = sessionById(otherId);
      if (!o || o.day !== session.day) return false;
      const oStart = timeToMin(o.start);
      const oEnd = timeToMin(o.end);
      return sStart < oEnd && oStart < sEnd;
    });
  }

  // Shared rAF scheduler
  const motion = (() => {
    const subs = new Set();
    let rafId = 0;

    function tick(now) {
      rafId = 0;
      if (document.visibilityState === "hidden" || subs.size === 0) return;
      for (const fn of Array.from(subs)) {
        try {
          fn(now);
        } catch (e) {
          subs.delete(fn);
        }
      }
      if (subs.size > 0 && document.visibilityState !== "hidden") {
        rafId = window.requestAnimationFrame(tick);
      }
    }

    function ensure() {
      if (!rafId && subs.size > 0 && document.visibilityState !== "hidden") {
        rafId = window.requestAnimationFrame(tick);
      }
    }

    document.addEventListener("visibilitychange", () => {
      if (document.visibilityState === "hidden") {
        if (rafId) {
          window.cancelAnimationFrame(rafId);
          rafId = 0;
        }
      } else {
        ensure();
      }
    });

    return {
      add(fn) {
        subs.add(fn);
        ensure();
      },
      remove(fn) {
        subs.delete(fn);
        if (subs.size === 0 && rafId) {
          window.cancelAnimationFrame(rafId);
          rafId = 0;
        }
      }
    };
  })();

  function setMotionState(on) {
    state.motionOn = Boolean(on);
    storageSet("afj5.motion", state.motionOn);
    document.documentElement.classList.toggle("motion-on", state.motionOn);
    const label = state.motionOn ? "(Motion: on)" : "(Motion: off)";
    const dBtn = document.getElementById("motion-toggle-desktop");
    const mBtn = document.getElementById("motion-toggle-mobile");
    [dBtn, mBtn].forEach(btn => {
      if (btn) {
        btn.textContent = label;
        btn.setAttribute("aria-pressed", state.motionOn ? "true" : "false");
      }
    });
    window.dispatchEvent(new CustomEvent("raster:motionchange", { detail: { on: state.motionOn } }));
  }

  // Bitmap glyph helpers
  function layoutGlyphLines(lines, gapRows, useBold) {
    const gap = gapRows || 2;
    const set = useBold ? DATA.glyphsBold : DATA.glyphs;
    let maxCols = 0;
    const cells = [];
    let rowOffset = 0;
    for (let l = 0; l < lines.length; l++) {
      const str = lines[l];
      let colOffset = 0;
      for (let i = 0; i < str.length; i++) {
        const ch = str[i];
        const g = set[ch] || set[" "];
        const w = g[0].length;
        for (let r = 0; r < 9; r++) {
          for (let c = 0; c < w; c++) {
            if (g[r][c] === "#") {
              cells.push({ x: colOffset + c, y: rowOffset + r });
            }
          }
        }
        colOffset += w + (i < str.length - 1 ? 1 : 0);
      }
      if (colOffset > maxCols) maxCols = colOffset;
      rowOffset += 9 + (l < lines.length - 1 ? gap : 0);
    }
    return { cols: maxCols, rows: rowOffset, cells };
  }

  function svgBitmapText(str, cellH, fill, opts) {
    const o = opts || {};
    const layout = layoutGlyphLines(Array.isArray(str) ? str : [str], 2, Boolean(o.bold));
    const vbW = layout.cols * 5;
    const vbH = layout.rows * 4;
    const color = fill || "currentColor";
    let rects = "";
    if (o.perCell) {
      for (let i = 0; i < layout.cells.length; i++) {
        const cell = layout.cells[i];
        rects += `<rect x="${cell.x * 5}" y="${cell.y * 4}" width="5" height="4" data-gx="${cell.x}" data-gy="${cell.y}"/>`;
      }
    } else {
      // Merge horizontal runs per row
      const rowMap = new Map();
      for (let i = 0; i < layout.cells.length; i++) {
        const cell = layout.cells[i];
        if (!rowMap.has(cell.y)) rowMap.set(cell.y, []);
        rowMap.get(cell.y).push(cell.x);
      }
      rowMap.forEach((xs, y) => {
        xs.sort((a, b) => a - b);
        let start = xs[0], prev = xs[0];
        for (let k = 1; k <= xs.length; k++) {
          if (k < xs.length && xs[k] === prev + 1) {
            prev = xs[k];
          } else {
            const span = prev - start + 1;
            rects += `<rect x="${start * 5}" y="${y * 4}" width="${span * 5}" height="4.04"/>`;
            if (k < xs.length) {
              start = xs[k];
              prev = xs[k];
            }
          }
        }
      });
    }
    const wAttr = o.fluid ? `width="100%"` : `width="${layout.cols * cellH * 1.25}" height="${layout.rows * cellH}"`;
    const cls = o.className ? ` class="${esc(o.className)}"` : "";
    const aria = o.ariaHidden ? ` aria-hidden="true"` : "";
    return `<svg${cls} viewBox="0 0 ${vbW} ${vbH}" ${wAttr} shape-rendering="crispEdges" fill="${color}"${aria}>${rects}</svg>`;
  }

  function svgPixelIcon(name, size) {
    const s = size || 15;
    const grids = {
      plus: ["..#..","..#..","#####","..#..","..#.."],
      minus: [".....",".....","#####",".....","....."],
      check: ["....#","...#.","#.#..",".#...","....."],
      "arrow-right": ["..#..","...#.","#####","...#.","..#.."],
      "tri-up": ["..#..",".###.","#####",".....","....."],
      "tri-down": [".....",".....","#####",".###.","..#.."],
      bell: ["..#..",".###.",".###.","#####","..#.."],
      qr: ["##.##","##.##","..#..","##.##","##.##"]
    };
    const g = grids[name] || grids.plus;
    let rects = "";
    for (let y = 0; y < 5; y++) {
      for (let x = 0; x < 5; x++) {
        if (g[y][x] === "#") {
          rects += `<rect x="${x}" y="${y}" width="1" height="1"/>`;
        }
      }
    }
    return `<svg width="${s}" height="${s}" viewBox="0 0 5 5" shape-rendering="crispEdges" fill="currentColor" aria-hidden="true">${rects}</svg>`;
  }

  function svgStrike() {
    return `<svg class="btn-strike" viewBox="0 0 100 100" preserveAspectRatio="none" aria-hidden="true"><line x1="0" y1="100" x2="100" y2="0" stroke="currentColor" stroke-width="1" vector-effect="non-scaling-stroke"/></svg>`;
  }

  // Tooltip controller
  const tipEl = document.getElementById("tip");
  let tipTimer = 0;

  function positionTip(rect) {
    const vw = window.innerWidth;
    const vh = window.innerHeight;
    tipEl.classList.add("is-visible");
    const tw = tipEl.offsetWidth;
    const th = tipEl.offsetHeight;
    let left = rect.right + 8;
    let top = rect.top - th - 8;
    if (left + tw > vw - 8) left = Math.max(8, rect.left - tw - 8);
    if (top < 8) top = Math.min(vh - th - 8, rect.bottom + 8);
    tipEl.style.left = `${Math.round(left)}px`;
    tipEl.style.top = `${Math.round(top)}px`;
  }

  function showTip(rect, text, immediate) {
    window.clearTimeout(tipTimer);
    if (!text) return;
    const run = () => {
      tipEl.textContent = text;
      positionTip(rect);
    };
    if (immediate) run();
    else tipTimer = window.setTimeout(run, 120);
  }

  function hideTip() {
    window.clearTimeout(tipTimer);
    tipEl.classList.remove("is-visible");

  // Pixel wipe overlay
  const wipeCanvas = document.getElementById("wipe-canvas");
  let wipeActive = false;

  function playWipe(onFull) {
    if (!state.motionOn || wipeActive) {
      if (onFull) onFull();
      return;
    }
    const ctx = wipeCanvas.getContext("2d");
    if (!ctx) {
      if (onFull) onFull();
      return;
    }
    wipeActive = true;
    const w = window.innerWidth;
    const h = window.innerHeight;
    const dpr = Math.min(window.devicePixelRatio || 1, 2);
    wipeCanvas.width = Math.round(w * dpr);
    wipeCanvas.height = Math.round(h * dpr);
    wipeCanvas.classList.add("is-active");
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);

    const cell = w >= 768 ? 48 : 32;
    const cols = Math.ceil(w / cell);
    const rows = Math.ceil(h / cell);
    const maxDiag = cols + rows - 2 || 1;
    const start = performance.now();
    let swapped = false;

    function step(now) {
      const elapsed = now - start;
      ctx.clearRect(0, 0, w, h);
      if (elapsed < 260) {
        const prog = elapsed / 260;
        const limit = prog * (maxDiag + 1);
        for (let r = 0; r < rows; r++) {
          for (let c = 0; c < cols; c++) {
            if (c + r <= limit) {
              ctx.fillStyle = TRACK_COLORS[(c + r) % 4];
              ctx.fillRect(c * cell, r * cell, cell, cell);
            }
          }
        }
      } else {
        if (!swapped) {
          swapped = true;
          if (onFull) onFull();
        }
        const prog = Math.min(1, (elapsed - 260) / 260);
        const limit = prog * (maxDiag + 1);
        for (let r = 0; r < rows; r++) {
          for (let c = 0; c < cols; c++) {
            if (c + r > limit) {
              ctx.fillStyle = TRACK_COLORS[(c + r) % 4];
              ctx.fillRect(c * cell, r * cell, cell, cell);
            }
          }
        }
        if (prog >= 1) {
          wipeCanvas.classList.remove("is-active");
          wipeActive = false;
          motion.remove(step);
          return;
        }
      }
    }
    motion.add(step);
  }

  // Pixel trail (pointer: fine, sodium & paper surfaces)
  const trailCanvas = document.getElementById("trail-canvas");
  let trailCells = [];
  let trailRunning = false;
  let trailColorIdx = 0;
  let lastTrailCellKey = "";

  function sizeTrailCanvas() {
    const w = window.innerWidth;
    const h = window.innerHeight;
    const dpr = Math.min(window.devicePixelRatio || 1, 2);
    trailCanvas.width = Math.round(w * dpr);
    trailCanvas.height = Math.round(h * dpr);
    const ctx = trailCanvas.getContext("2d");
    if (ctx) ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  }

  function tickTrail(now) {
    const ctx = trailCanvas.getContext("2d");
    if (!ctx) {
      trailRunning = false;
      motion.remove(tickTrail);
      return;
    }
    const w = window.innerWidth;
    const h = window.innerHeight;
    ctx.clearRect(0, 0, w, h);
    if (!state.motionOn) {
      trailCells = [];
      trailRunning = false;
      motion.remove(tickTrail);
      return;
    }
    const alive = [];
    for (let i = 0; i < trailCells.length; i++) {
      const c = trailCells[i];
      const age = now - c.born;
      if (age >= 420) continue;
      alive.push(c);
      ctx.fillStyle = c.color;
      if (age < 140) {
        ctx.fillRect(c.gx * 16, c.gy * 16, 16, 16);
      } else if (age < 280) {
        ctx.fillRect(c.gx * 16 + 4, c.gy * 16 + 4, 8, 8);
      } else {
        ctx.fillRect(c.gx * 16 + 6, c.gy * 16 + 6, 4, 4);
      }
    }
    trailCells = alive;
    if (trailCells.length === 0) {
      trailRunning = false;
      motion.remove(tickTrail);
    }
  }

  function initTrail() {
    if (!window.matchMedia || !window.matchMedia("(pointer: fine)").matches) return;
    sizeTrailCanvas();
    window.addEventListener("resize", sizeTrailCanvas, { passive: true });
    window.addEventListener("pointermove", e => {
      if (!state.motionOn || document.documentElement.classList.contains("menu-open")) return;
      const el = document.elementFromPoint(e.clientX, e.clientY);
      const surfEl = el && el.closest ? el.closest("[data-surface]") : null;
      const surf = surfEl ? surfEl.getAttribute("data-surface") : "sodium";
      if (surf === "ink") return;
      const gx = Math.floor(e.clientX / 16);
      const gy = Math.floor(e.clientY / 16);
      const key = `${gx},${gy}`;
      if (key === lastTrailCellKey) return;
      lastTrailCellKey = key;
      const color = TRAIL_COLORS[trailColorIdx % TRAIL_COLORS.length];
      trailColorIdx++;
      trailCells.push({ gx, gy, born: performance.now(), color });
      if (trailCells.length > 14) trailCells.shift();
      if (!trailRunning) {
        trailRunning = true;
        motion.add(tickTrail);
      }
    }, { passive: true });
  }

        const apply = () => {

              r.setAttribute("x", String(bx + d[0]));
