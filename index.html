  // CMS data hydration (Netlify CMS Git-backed JSON with DATA fallback)
  async function loadCmsConfig() {
    try {
      const res = await fetch("./data/cms-config.json", { cache: "no-store" });
      if (!res.ok) return;
      const cms = await res.json();
      if (cms && Array.isArray(cms.tickets) && cms.tickets.length > 0) {
        DATA.tickets = cms.tickets;
      }
      if (cms && cms.scanner && typeof cms.scanner === "object") {
        if (typeof cms.scanner.verifyEndpoint === "string") DATA.cms.verifyEndpoint = cms.scanner.verifyEndpoint;
        if (typeof cms.scanner.eventbriteOrg === "string") DATA.cms.eventbriteOrg = cms.scanner.eventbriteOrg;
        if (Array.isArray(cms.scanner.acceptedPrefixes)) DATA.cms.acceptedPrefixes = cms.scanner.acceptedPrefixes;
        if (Array.isArray(cms.scanner.passes)) DATA.cms.passes = cms.scanner.passes;
      }
      if (currentRouteKey === "tickets" || currentRouteKey === "home") {
        const main = document.getElementById("main");
        if (currentRouteKey === "tickets") renderTickets(main);
        else if (currentRouteKey === "home") renderHome(main);
        setupObservers();
      }
    } catch (e) {
      // Offline or local fallback uses built-in DATA
    }
  }

  // Agenda Reminders Engine (15-min default, customizable lead time & note, Browser Notification + In-app Banner)
  function saveRemindersState() {
    storageSet("afj5.reminders", state.reminders);
  }

  function getSessionStartDate(session) {
    const dayObj = dayById(session.day);
    const dateStr = (dayObj && dayObj.date) || DATA.meta.dates.start;
    return new Date(`${dateStr}T${session.start}:00Z`);
  }

  function getArmedAgendaSessions() {
    const mins = state.reminders.minutesBefore || 15;
    return state.agenda
      .map(id => sessionById(id))
      .filter(Boolean)
      .sort((a, b) => timeToMin(a.start) - timeToMin(b.start))
      .map(s => {
        const startDate = getSessionStartDate(s);
        const triggerDate = new Date(startDate.getTime() - mins * 60000);
        return { session: s, startDate, triggerDate };
      });
  }

  function formatReminderTimeGMT(dateObj) {
    const hh = String(dateObj.getUTCHours()).padStart(2, "0");
    const mm = String(dateObj.getUTCMinutes()).padStart(2, "0");
    return `${hh}.${mm} GMT`;
  }

  function showInAppReminderBanner(opts) {
    const banner = document.getElementById("reminder-banner");
    if (!banner) return;
    const kickerEl = document.getElementById("reminder-banner-kicker");
    const timeEl = document.getElementById("reminder-banner-time");
    const titleEl = document.getElementById("reminder-banner-title");
    const metaEl = document.getElementById("reminder-banner-meta");
    const noteEl = document.getElementById("reminder-banner-note");

    kickerEl.textContent = opts.isTest ? "(Test session reminder)" : "(Upcoming session reminder)";
    timeEl.textContent = `${opts.minutesBefore}m prior`;
    titleEl.textContent = opts.title;
    metaEl.textContent = opts.meta;
    if (opts.customNote && opts.customNote.trim()) {
      noteEl.textContent = `Note: ${opts.customNote.trim()}`;
      noteEl.hidden = false;
    } else {
      noteEl.textContent = "";
      noteEl.hidden = true;
    }
    banner.classList.add("is-visible");
  }

  function fireSessionReminder(session, opts) {
    const o = opts || {};
    const mins = state.reminders.minutesBefore || 15;
    const rm = roomById(session.room);
    const roomName = rm ? rm.name : "Dance House | Tŷ Dawns";
    const metaText = `Starts ${fmtTime(session.start)}–${fmtTime(session.end)} · ${roomName}`;
    const note = (state.reminders.customNote || "").trim();

    showInAppReminderBanner({
      isTest: Boolean(o.isTest),
      minutesBefore: mins,
      title: session.title,
      meta: metaText,
      customNote: note
    });

    if ("Notification" in window && Notification.permission === "granted") {
      try {
        const bodyParts = [`In ${mins} min (${fmtTime(session.start)} · ${roomName})`];
        if (note) bodyParts.push(`Note: ${note}`);
        new Notification(
          o.isTest ? `AFJ Cardiff (Test) · ${session.title}` : `AFJ Cardiff · ${session.title}`,
          {
            body: bodyParts.join(" — "),
            tag: o.isTest ? `afj-test-${Date.now()}` : `afj-rem-${session.id}-${mins}`
          }
        );
      } catch (e) {
        // Fallback already shown via in-app banner
      }
    }
  }

  function evaluateAgendaReminders() {
    if (!state.reminders.enabled || state.agenda.length === 0) return;
    const now = Date.now();
    const mins = state.reminders.minutesBefore || 15;
    const armed = getArmedAgendaSessions();
    for (const item of armed) {
      const trigMs = item.triggerDate.getTime();
      const endWindowMs = item.startDate.getTime() + 5 * 60000;
      const fireKey = `${mins}`;
      if (now >= trigMs && now <= endWindowMs && state.reminders.fired[item.session.id] !== fireKey) {
        state.reminders.fired[item.session.id] = fireKey;
        saveRemindersState();
        fireSessionReminder(item.session, { isTest: false });
      }
    }
  }

  async function requestBrowserNotificationPermission() {
    if (!("Notification" in window)) return "unsupported";
    if (Notification.permission === "granted") return "granted";
    try {
      const perm = await Notification.requestPermission();
      return perm;
    } catch (e) {
      return Notification.permission || "denied";
    }
  }

  function initReminderEngine() {
    const dismissBtn = document.getElementById("reminder-banner-dismiss");
    const banner = document.getElementById("reminder-banner");
    const linkEl = document.getElementById("reminder-banner-link");
    if (dismissBtn && banner) {
      dismissBtn.addEventListener("click", () => banner.classList.remove("is-visible"));
    }
    if (linkEl && banner) {
      linkEl.addEventListener("click", () => banner.classList.remove("is-visible"));
    }
    evaluateAgendaReminders();
    window.setInterval(evaluateAgendaReminders, 15000);
    window.addEventListener("afj:agendachange", evaluateAgendaReminders);
  }

  // Surface + reveal observers per route
  let surfaceHeaderIO = null;
  let surfaceBottomIO = null;
  let revealIO = null;

  function setupObservers() {
    if (surfaceHeaderIO) surfaceHeaderIO.disconnect();
    if (surfaceBottomIO) surfaceBottomIO.disconnect();
    if (revealIO) revealIO.disconnect();

    const header = document.getElementById("site-header");
    const topBtn = document.getElementById("top-btn");

    const surfaceEls = Array.from(document.querySelectorAll("[data-surface]")).filter(
      el => el.id !== "site-header" && el.id !== "menu" && el.id !== "top-btn"
    );

    const setHeaderSurface = surf => {
      if (surf) header.setAttribute("data-surface", surf);
    };
    const setBottomSurface = surf => {
      if (surf) {
        topBtn.setAttribute("data-surface", surf);
      }
    };

    const syncSurfacesAtScroll = () => {
      const hh = header.getBoundingClientRect().height || 64;
      const topY = hh + 4;
      const botY = window.innerHeight - 20;
      for (const el of surfaceEls) {
        const r = el.getBoundingClientRect();
        if (r.top <= topY && r.bottom >= topY) setHeaderSurface(el.getAttribute("data-surface"));
        if (r.top <= botY && r.bottom >= botY) setBottomSurface(el.getAttribute("data-surface"));
      }
      topBtn.classList.toggle("is-visible", window.scrollY >= window.innerHeight);
    };

    surfaceHeaderIO = new IntersectionObserver(entries => {
      for (const entry of entries) {
        if (entry.isIntersecting) {
          setHeaderSurface(entry.target.getAttribute("data-surface"));
        }
      }
    }, { rootMargin: "-65px 0px -88% 0px" });

    surfaceBottomIO = new IntersectionObserver(entries => {
      for (const entry of entries) {
        if (entry.isIntersecting) {
          setBottomSurface(entry.target.getAttribute("data-surface"));
        }
      }
    }, { rootMargin: "-95% 0px -1px 0px" });

    surfaceEls.forEach(el => {
      surfaceHeaderIO.observe(el);
      surfaceBottomIO.observe(el);
    });

    window.addEventListener("scroll", syncSurfacesAtScroll, { passive: true });
    state.routeCleanup.push(() => window.removeEventListener("scroll", syncSurfacesAtScroll));
    syncSurfacesAtScroll();

    // Stepped reveals
    const revealEls = Array.from(document.querySelectorAll(".reveal-text, .reveal-block"));
    if (!state.motionOn) {
      revealEls.forEach(el => {
        el.classList.remove("is-pending");
        el.classList.add("is-shown");
      });
    } else {
      revealEls.forEach(el => el.classList.add("is-pending"));
      revealIO = new IntersectionObserver(entries => {
        let batch = 0;
        for (const entry of entries) {
          if (entry.isIntersecting) {
            const el = entry.target;
            const delay = Math.min(batch, 7) * 40;
            batch++;
            window.setTimeout(() => {
              el.classList.remove("is-pending");
              el.classList.add("is-shown");
            }, delay);
            revealIO.unobserve(el);
          }
        }
      }, { threshold: 0.15 });
      revealEls.forEach(el => revealIO.observe(el));
    }
  }

  // Portrait Canvas Renderer (§3.R)
  function initPortraitCanvas(canvas, speaker, opts) {
    const o = opts || {};
    const rows = speaker.portrait.rows && speaker.portrait.rows.length === 32
      ? speaker.portrait.rows
      : fallbackPortraitRows(speaker.id);
    const pal = speaker.portrait.pal;

    let blockSize = o.blockSize || 1;
    let currentGrid = poolGrid(rows, blockSize);
    let assembled = !state.motionOn || Boolean(o.skipAssemble);
    let assembleStart = 0;
    let waveStart = 0;
    let waveDir = 0; // 0 = idle(0/1 normal), 1 = forward(swapping to 1/0), -1 = reversing
    let swapped = false;
    let animActive = false;
    let lastSize = 0;

    // Seeded shuffle of non-zero cells for assemble
    const rng = makeRng(hashStr(speaker.id));
    const fgIndices = [];
    for (let y = 0; y < 32; y++) {
      for (let x = 0; x < 32; x++) {
        if (currentGrid[y][x] !== "0") fgIndices.push(y * 32 + x);
      }
    }
    for (let i = fgIndices.length - 1; i > 0; i--) {
      const j = Math.floor(rng() * (i + 1));
      const tmp = fgIndices[i];
      fgIndices[i] = fgIndices[j];
      fgIndices[j] = tmp;
    }
    const orderRank = new Int16Array(1024).fill(-1);
    fgIndices.forEach((pos, idx) => {
      orderRank[pos] = idx;
    });

    function poolGrid(srcRows, bSize) {
      if (bSize <= 1) return srcRows;
      const out = [];
      for (let y = 0; y < 32; y += bSize) {
        const blockRows = [];
        for (let dy = 0; dy < bSize; dy++) blockRows.push("");
        for (let x = 0; x < 32; x += bSize) {
          const counts = [0, 0, 0, 0];
          for (let dy = 0; dy < bSize; dy++) {
            const r = srcRows[y + dy];
            for (let dx = 0; dx < bSize; dx++) {
              counts[Number(r[x + dx]) || 0]++;
            }
          }
          let bestIdx = 0;
          let bestCount = -1;
          for (let c = 0; c < 4; c++) {
            if (counts[c] > bestCount) {
              bestCount = counts[c];
              bestIdx = c;
            }
          }
          const ch = String(bestIdx);
          for (let dy = 0; dy < bSize; dy++) {
            blockRows[dy] += ch.repeat(bSize);
          }
        }
        for (let dy = 0; dy < bSize; dy++) out.push(blockRows[dy]);
      }
      return out;
    }

    function sizeCanvas() {
      const rect = canvas.getBoundingClientRect();
      const cssSize = Math.round(rect.width);
      if (cssSize <= 0 || cssSize === lastSize) return cssSize > 0;
      lastSize = cssSize;
      const dpr = Math.min(window.devicePixelRatio || 1, 2);
      canvas.width = Math.round(cssSize * dpr);
      canvas.height = Math.round(cssSize * dpr);
      const ctx = canvas.getContext("2d");
      if (ctx) ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
      return true;
    }

    function drawFrame(now) {
      const ctx = canvas.getContext("2d");
      if (!ctx || lastSize <= 0) return;
      const size = lastSize;
      const cell = Math.floor(size / 32);
      const gridPx = cell * 32;
      const ox = Math.floor((size - gridPx) / 2);
      const oy = Math.floor((size - gridPx) / 2);

      // Paint background including leftover margin
      ctx.fillStyle = pal[0];
      ctx.fillRect(0, 0, size, size);

      let assembleLimit = fgIndices.length;
      if (!assembled) {
        const elapsed = now - assembleStart;
        const p = Math.min(1, Math.max(0, elapsed / 640));
        assembleLimit = Math.floor(p * fgIndices.length);
        if (p >= 1) assembled = true;
      }

      let waveElapsed = -1;
      let waveDone = true;
      if (waveDir !== 0) {
        waveElapsed = now - waveStart;
        if (waveElapsed < 360) waveDone = false;
        else {
          swapped = waveDir === 1;
          waveDir = 0;
        }
      }

      let sweepElapsed = -1;
      let sweepDone = true;
      if (sweepActive) {
        sweepElapsed = now - sweepStart;
        if (sweepElapsed < 200) sweepDone = false;
        else sweepActive = false;
      }

      // Draw merged horizontal runs per row
      for (let y = 0; y < 32; y++) {
        let runStart = 0;
        let runIdx = -1;
        for (let x = 0; x <= 32; x++) {
          let idx = 0;
          if (x < 32) {
            const useOld = sweepActive && !sweepDone && ((x + y) / 62) * 200 > sweepElapsed;
            const srcGrid = useOld ? prevGrid : currentGrid;
            const raw = Number(srcGrid[y][x]) || 0;
            if (!assembled && raw !== 0) {
              const rank = orderRank[y * 32 + x];
              idx = rank < assembleLimit ? raw : 0;
            } else {
              idx = raw;
            }
            // Apply palette swap wave (0 <-> 1)
            let isSwapped = swapped;
            if (waveDir !== 0) {
              const threshold = ((x + y) / 62) * 360;
              if (waveDir === 1) isSwapped = waveElapsed >= threshold;
              else isSwapped = waveElapsed < threshold;
            }
            if (isSwapped && (idx === 0 || idx === 1)) {
              idx = idx === 0 ? 1 : 0;
            }
          }
          if (x === 0) {
            runIdx = idx;
            runStart = 0;
          } else if (x === 32 || idx !== runIdx) {
            if (runIdx !== 0 || swapped || waveDir !== 0) {
              ctx.fillStyle = pal[runIdx];
              ctx.fillRect(ox + runStart * cell, oy + y * cell, (x - runStart) * cell, cell);
            }
            runStart = x;
            runIdx = idx;
          }
        }
      }

      if (assembled && waveDone && sweepDone) {
        animActive = false;
        motion.remove(drawFrame);
      }
    }

    let prevGrid = currentGrid;
    let sweepActive = false;
    let sweepStart = 0;

    function startAnim() {
      if (!animActive) {
        animActive = true;
        motion.add(drawFrame);
      }
    }

    function renderImmediate() {
      if (sizeCanvas()) drawFrame(performance.now());
    }

    // Observe first view assemble
    const io = new IntersectionObserver(entries => {
      for (const entry of entries) {
        if (entry.isIntersecting) {
          io.disconnect();
          sizeCanvas();
          if (!state.motionOn || o.skipAssemble) {
            assembled = true;
            drawFrame(performance.now());
          } else {
            assembled = false;
            assembleStart = performance.now();
            startAnim();
          }
        }
      }
    }, { threshold: 0.3 });
    io.observe(canvas);

    // ResizeObserver (debounced 150ms)
    let rTimer = 0;
    const ro = new ResizeObserver(() => {
      window.clearTimeout(rTimer);
      rTimer = window.setTimeout(() => {
        const prev = lastSize;
        sizeCanvas();
        if (lastSize !== prev) drawFrame(performance.now());
      }, 150);
    });
    ro.observe(canvas);

    // Hover / focus swap on (hover: hover)
    const hoverTarget = canvas.closest("a") || canvas;
    if (window.matchMedia && window.matchMedia("(hover: hover)").matches) {
      const triggerSwap = toSwapped => {
        if (!state.motionOn) {
          swapped = toSwapped;
          waveDir = 0;
          drawFrame(performance.now());
          return;
        }
        waveDir = toSwapped ? 1 : -1;
        waveStart = performance.now();
        startAnim();
      };
      hoverTarget.addEventListener("mouseenter", () => triggerSwap(true));
      hoverTarget.addEventListener("mouseleave", () => triggerSwap(false));
      hoverTarget.addEventListener("focusin", () => triggerSwap(true));
      hoverTarget.addEventListener("focusout", () => triggerSwap(false));
    }

    const onMotionChange = () => {
      if (!state.motionOn) {
        assembled = true;
        sweepActive = false;
        waveDir = 0;
        swapped = false;
        renderImmediate();
      }
    };
    window.addEventListener("raster:motionchange", onMotionChange);

    state.routeCleanup.push(() => {
      io.disconnect();
      ro.disconnect();
      window.clearTimeout(rTimer);
      motion.remove(drawFrame);
      window.removeEventListener("raster:motionchange", onMotionChange);
    });

    // Initial paint
    window.requestAnimationFrame(renderImmediate);

    return {
      setBlockSize(newSize) {
        if (newSize === blockSize) return;
        prevGrid = currentGrid;
        blockSize = newSize;
        currentGrid = poolGrid(rows, blockSize);
        if (!state.motionOn) {
          sweepActive = false;
          drawFrame(performance.now());
        } else {
          sweepActive = true;
          sweepStart = performance.now();
          startAnim();
        }
      }
    };
  }

  // Capacity Grid Component (L8 & Tickets)
  function buildCapacityGrid(container, opts) {
    const o = opts || {};
    const total = DATA.meta.capacity;
    const isMobile = window.innerWidth < 768;
    const cols = isMobile ? 20 : 40;
    const rows = Math.ceil(total / cols);
    const gap = window.innerWidth >= 1024 ? 2 : 1;
    const cell = 10;
    const step = cell + gap;
    const vbW = cols * step - gap;
    const vbH = rows * step - gap;

    const cellsMeta = [];
    let cursor = 0;
    DATA.tickets.forEach(t => {
      for (let k = 0; k < t.sold && cursor < total; k++) {
        cellsMeta.push({
          idx: cursor,
          tier: t.id,
          color: t.color,
          label: `Place ${cursor + 1} of ${total} · ${t.name} (£${t.price}), reserved`
        });
        cursor++;
      }
    });
    while (cursor < total) {
      cellsMeta.push({
        idx: cursor,
        tier: "open",
        color: DATA.tokens.sodium,
        label: `Place ${cursor + 1} of ${total} · available`
      });
      cursor++;
    }

    const soldTotal = DATA.tickets.reduce((acc, t) => acc + t.sold, 0);
    const openTotal = Math.max(0, total - soldTotal);

    let rects = "";
    for (let i = 0; i < total; i++) {
      const c = i % cols;
      const r = Math.floor(i / cols);
      const x = c * step;
      const y = r * step;
      const m = cellsMeta[i];
      if (m.tier === "open") {
        rects += `<rect data-ci="${i}" x="${x + 0.5}" y="${y + 0.5}" width="${cell - 1}" height="${cell - 1}" fill="${DATA.tokens.sodium}" stroke="${DATA.tokens.ink}" stroke-width="1"/>`;
      } else {
        rects += `<rect data-ci="${i}" x="${x}" y="${y}" width="${cell}" height="${cell}" fill="${DATA.tokens.sodium}" stroke="${DATA.tokens.ink}" stroke-width="1"/>`;
      }
    }

    container.innerHTML = `
      <figure class="capacity-fig">
        <div class="capacity-svg-wrap" tabindex="0" role="img" aria-label="Capacity grid: ${soldTotal} of ${total} places reserved, ${openTotal} available. Use arrow keys to inspect cells.">
          <svg class="capacity-svg" viewBox="0 0 ${vbW} ${vbH}" shape-rendering="crispEdges" aria-hidden="true">${rects}<rect id="cap-focus-ring" x="0" y="0" width="${cell}" height="${cell}" fill="none" stroke="${DATA.tokens.ink}" stroke-width="2" visibility="hidden"/></svg>
        </div>
        <figcaption class="t-micro" style="margin-top:8px;">(Fig. 1 — Dance House | Tŷ Dawns capacity: ${total} cells, one per admission place.)</figcaption>
        <ul class="capacity-legend t-micro">
          ${DATA.tickets.map(t => `<li class="legend-item"><span class="legend-swatch" style="background:${t.color}"></span>${esc(t.name)} (£${t.price}), ${t.sold} reserved</li>`).join("")}
          <li class="legend-item"><span class="legend-swatch" style="background:${DATA.tokens.sodium}"></span>Available, ${openTotal}</li>
          ${o.withSelection ? `<li class="legend-item"><span class="legend-swatch" style="background:${DATA.tokens.ink}"></span>Selected</li>` : ""}
        </ul>
      </figure>
    `;

    const svg = container.querySelector(".capacity-svg");
    const wrap = container.querySelector(".capacity-svg-wrap");
    const focusRing = svg.querySelector("#cap-focus-ring");
    const rectEls = Array.from(svg.querySelectorAll("rect[data-ci]"));
    let filledCount = 0;
    let selectedOverlay = 0;

    function paintCell(i, isSelected) {
      const m = cellsMeta[i];
      const el = rectEls[i];
      if (!el) return;
      if (isSelected) {
        el.setAttribute("fill", DATA.tokens.ink);
        el.removeAttribute("stroke");
      } else if (m.tier === "open" || i >= filledCount) {
        el.setAttribute("fill", DATA.tokens.sodium);
        el.setAttribute("stroke", DATA.tokens.ink);
        el.setAttribute("stroke-width", "1");
      } else {
        el.setAttribute("fill", m.color);
        el.removeAttribute("stroke");
      }
    }

    function fillImmediate() {
      filledCount = soldTotal;
      for (let i = 0; i < soldTotal; i++) paintCell(i, false);
      for (let i = soldTotal; i < total; i++) {
        paintCell(i, i - soldTotal < selectedOverlay);
      }
    }

    // Fill animation when 30% visible
    let fillAnimRunning = false;
    function tickFill() {
      const nextEnd = Math.min(soldTotal, filledCount + 6);
      for (let i = filledCount; i < nextEnd; i++) {
        filledCount = i + 1;
        paintCell(i, false);
      }
      if (filledCount >= soldTotal) {
        fillAnimRunning = false;
        motion.remove(tickFill);
      }
    }

    if (!state.motionOn || o.instant) {
      fillImmediate();
    } else {
      const io = new IntersectionObserver(entries => {
        for (const entry of entries) {
          if (entry.isIntersecting) {
            io.disconnect();
            if (!state.motionOn) {
              fillImmediate();
            } else if (!fillAnimRunning) {
              fillAnimRunning = true;
              motion.add(tickFill);
            }
          }
        }
      }, { threshold: 0.3 });
      io.observe(svg);
      state.routeCleanup.push(() => {
        io.disconnect();
        motion.remove(tickFill);
      });
    }

    // Mouse tooltip
    svg.addEventListener("pointermove", e => {
      const rectEl = e.target.closest("rect[data-ci]");
      if (!rectEl) {
        hideTip();
        return;
      }
      const idx = Number(rectEl.dataset.ci);
      const isSel = idx >= soldTotal && (idx - soldTotal) < selectedOverlay;
      const msg = isSel ? `Seat ${idx + 1} of ${total} · selected` : cellsMeta[idx].label;
      showTip(rectEl.getBoundingClientRect(), msg, false);
    });
    svg.addEventListener("pointerleave", hideTip);

    // Keyboard arrow cell focus
    let keyIdx = 0;
    const showKeyCell = () => {
      const c = keyIdx % cols;
      const r = Math.floor(keyIdx / cols);
      focusRing.setAttribute("x", String(c * step - 1));
      focusRing.setAttribute("y", String(r * step - 1));
      focusRing.setAttribute("width", String(cell + 2));
      focusRing.setAttribute("height", String(cell + 2));
      focusRing.setAttribute("visibility", "visible");
      const isSel = keyIdx >= soldTotal && (keyIdx - soldTotal) < selectedOverlay;
      const msg = isSel ? `Seat ${keyIdx + 1} of ${total} · selected` : cellsMeta[keyIdx].label;
      showTip(rectEls[keyIdx].getBoundingClientRect(), msg, true);
    };

    wrap.addEventListener("focus", showKeyCell);
    wrap.addEventListener("blur", () => {
      focusRing.setAttribute("visibility", "hidden");
      hideTip();
    });
    wrap.addEventListener("keydown", e => {
      if (e.key === "ArrowRight") keyIdx = Math.min(total - 1, keyIdx + 1);
      else if (e.key === "ArrowLeft") keyIdx = Math.max(0, keyIdx - 1);
      else if (e.key === "ArrowDown") keyIdx = Math.min(total - 1, keyIdx + cols);
      else if (e.key === "ArrowUp") keyIdx = Math.max(0, keyIdx - cols);
      else return;
      e.preventDefault();
      showKeyCell();
    });

    let selTimer = 0;
    return {
      setSelected(count) {
        window.clearInterval(selTimer);
        if (!state.motionOn) {
          selectedOverlay = count;
          for (let i = soldTotal; i < total; i++) {
            paintCell(i, i - soldTotal < selectedOverlay);
          }
          return;
        }
        if (count === selectedOverlay) return;
        selTimer = window.setInterval(() => {
          if (selectedOverlay < count) {
            selectedOverlay++;
            paintCell(soldTotal + selectedOverlay - 1, true);
          } else if (selectedOverlay > count) {
            paintCell(soldTotal + selectedOverlay - 1, false);
            selectedOverlay--;
          }
          if (selectedOverlay === count) window.clearInterval(selTimer);
        }, 30);
      }
    };
  }

  // L1 Hero Particle Canvas
  function initHeroCanvas() {
    const canvas = document.getElementById("hero-canvas");
    const captionEl = document.getElementById("hero-cycle-caption");
    const ctx = canvas.getContext("2d");
    if (!ctx) return;

    let cssW = 0, cssH = 0, dpr = 1;
    let isMobile = window.innerWidth < 768;
    let cycleIdx = 0;
    let particles = [];
    let morphStart = 0;
    let morphDuration = 1200;
    let isAssembling = true;
    let holdTimer = 0;
    let inView = true;
    let running = false;
    let pointerX = -9999, pointerY = -9999;

    function getTargetLayout(idx) {
      const item = DATA.copy.heroCycle[idx];
      const lines = isMobile ? item.mobile : [item.desktop];
      const layout = layoutGlyphLines(lines, 2, true);
      return {
        totalCols: isMobile ? 31 : 39,
        totalRows: isMobile ? 20 : 9,
        cells: layout.cells
      };
    }

    function sizeCanvas() {
      const rect = canvas.getBoundingClientRect();
      isMobile = window.innerWidth < 768;
      cssW = rect.width;
      cssH = rect.height;
      if (cssW <= 0 || cssH <= 0) return;
      dpr = Math.min(window.devicePixelRatio || 1, 2);
      canvas.width = Math.round(cssW * dpr);
      canvas.height = Math.round(cssH * dpr);
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    }

    function buildParticlesForTarget(idx, assembleFromRandom) {
      const t = getTargetLayout(idx);
      const rng = makeRng(hashStr("hero-" + idx + "-" + Date.now()));
      const newParticles = [];
      const targetCells = t.cells;
      const oldParticles = particles;

      if (assembleFromRandom || oldParticles.length === 0) {
        for (let i = 0; i < targetCells.length; i++) {
          const tc = targetCells[i];
          newParticles.push({
            sx: assembleFromRandom ? rng() * t.totalCols : tc.x,
            sy: assembleFromRandom ? rng() * t.totalRows : tc.y,
            tx: tc.x,
            ty: tc.y,
            x: tc.x,
            y: tc.y,
            vx: 0,
            vy: 0,
            delay: assembleFromRandom ? rng() * 400 : 0,
            color: DATA.tokens.paper,
            sparkle: false
          });
        }
        isAssembling = assembleFromRandom;
        morphDuration = 1200;
      } else {
        const count = Math.max(oldParticles.length, targetCells.length);
        for (let i = 0; i < count; i++) {
          const src = oldParticles[i % oldParticles.length];
          const dst = targetCells[i % targetCells.length];
          const isSparkle = rng() < 0.12;
          newParticles.push({
            sx: src.x,
            sy: src.y,
            tx: dst.x,
            ty: dst.y,
            x: src.x,
            y: src.y,
            vx: 0,
            vy: 0,
            delay: (dst.x / t.totalCols) * 300,
            color: isSparkle ? TRACK_COLORS[Math.floor(rng() * 4)] : DATA.tokens.paper,
            sparkle: isSparkle
          });
        }
        isAssembling = false;
        morphDuration = 900;
      }
      particles = newParticles;
      morphStart = performance.now();
      captionEl.textContent = DATA.copy.heroCycle[idx].caption;
    }

    function drawStatic() {
      sizeCanvas();
      if (cssW <= 0) return;
      const t = getTargetLayout(0);
      const cellW = cssW / t.totalCols;
      const cellH = cellW / 1.25;
      ctx.fillStyle = DATA.tokens.ink;
      ctx.fillRect(0, 0, cssW, cssH);
      ctx.fillStyle = DATA.tokens.paper;
      for (let i = 0; i < t.cells.length; i++) {
        const c = t.cells[i];
        const x0 = Math.round(c.x * cellW * dpr) / dpr;
        const y0 = Math.round(c.y * cellH * dpr) / dpr;
        const x1 = Math.round((c.x + 1) * cellW * dpr) / dpr;
        const y1 = Math.round((c.y + 1) * cellH * dpr) / dpr;
        ctx.fillRect(x0, y0, x1 - x0, y1 - y0);
      }
      captionEl.textContent = DATA.copy.heroCycle[0].caption;
    }

    function step(now) {
      if (!state.motionOn) {
        running = false;
        motion.remove(step);
        drawStatic();
        return;
      }
      if (cssW <= 0) sizeCanvas();
      if (cssW <= 0) return;

      const t = getTargetLayout(cycleIdx);
      const cellW = cssW / t.totalCols;
      const cellH = cellW / 1.25;
      const elapsed = now - morphStart;
      const easeFn = isAssembling ? easeAssemble : easeMorph;
      const repelRadius = cellW * 3;
      const maxDisp = 1.5;

      ctx.fillStyle = DATA.tokens.ink;
      ctx.fillRect(0, 0, cssW, cssH);

      // Group draws by colour (paper glyphs vs ramp sparkles on obsidian)
      const buckets = new Map();
      buckets.set(DATA.tokens.paper, []);
      let allSettled = pointerX < -5000;

      for (let i = 0; i < particles.length; i++) {
        const p = particles[i];
        const localT = Math.min(1, Math.max(0, (elapsed - p.delay) / morphDuration));
        const e = easeFn(localT);
        const baseX = p.sx + (p.tx - p.sx) * e;
        const baseY = p.sy + (p.ty - p.sy) * e;

        // Cursor repel spring
        let targetDx = 0, targetDy = 0;
        if (pointerX > -5000) {
          const px = (baseX + 0.5) * cellW;
          const py = (baseY + 0.5) * cellH;
          const dx = px - pointerX;
          const dy = py - pointerY;
          const dist = Math.hypot(dx, dy);
          if (dist > 0.001 && dist < repelRadius) {
            const push = (1 - dist / repelRadius) * maxDisp;
            targetDx = (dx / dist) * push;
            targetDy = (dy / dist) * push;
          }
        }
        if (localT >= 1 && pointerX < -5000) {
          p.vx = 0;
          p.vy = 0;
          p.x = p.tx;
          p.y = p.ty;
        } else {
          allSettled = false;
          p.vx = (p.vx + (targetDx - (p.x - baseX)) * 0.12) * 0.8;
          p.vy = (p.vy + (targetDy - (p.y - baseY)) * 0.12) * 0.8;
          p.x = baseX + (p.x - baseX) + p.vx;
          p.y = baseY + (p.y - baseY) + p.vy;
        }

        const col = (p.sparkle && elapsed < 400) ? p.color : DATA.tokens.paper;
        if (!buckets.has(col)) buckets.set(col, []);
        buckets.get(col).push(p);
      }

      if (allSettled && elapsed >= 400) {
        // Draw merged horizontal runs per row for zero-seam rendering at any DPR
        ctx.fillStyle = DATA.tokens.paper;
        const rowMap = new Map();
        for (let i = 0; i < particles.length; i++) {
          const p = particles[i];
          if (!rowMap.has(p.ty)) rowMap.set(p.ty, []);
          rowMap.get(p.ty).push(p.tx);
        }
        rowMap.forEach((xs, y) => {
          xs.sort((a, b) => a - b);
          let start = xs[0], prev = xs[0];
          const y0 = Math.round(y * cellH * dpr) / dpr;
          const y1 = Math.round((y + 1) * cellH * dpr) / dpr;
          for (let k = 1; k <= xs.length; k++) {
            if (k < xs.length && (xs[k] === prev + 1 || xs[k] === prev)) {
              prev = xs[k];
            } else {
              const x0 = Math.round(start * cellW * dpr) / dpr;
              const x1 = Math.round((prev + 1) * cellW * dpr) / dpr;
              ctx.fillRect(x0, y0, x1 - x0, y1 - y0);
              if (k < xs.length) {
                start = xs[k];
                prev = xs[k];
              }
            }
          }
        });
      } else {
        buckets.forEach((list, col) => {
          ctx.fillStyle = col;
          for (let i = 0; i < list.length; i++) {
            const p = list[i];
            const x0 = Math.round(p.x * cellW * dpr) / dpr;
            const y0 = Math.round(p.y * cellH * dpr) / dpr;
            const x1 = Math.round((p.x + 1) * cellW * dpr) / dpr;
            const y1 = Math.round((p.y + 1) * cellH * dpr) / dpr;
            ctx.fillRect(x0, y0, x1 - x0, y1 - y0);
          }
        });
      }
    }

    function scheduleNext() {
      window.clearTimeout(holdTimer);
      if (!state.motionOn || !inView) return;
      holdTimer = window.setTimeout(() => {
        if (!state.motionOn || !inView || document.hidden) return;
        cycleIdx = (cycleIdx + 1) % DATA.copy.heroCycle.length;
        buildParticlesForTarget(cycleIdx, false);
        scheduleNext();
      }, 3200 + morphDuration);
    }

    function startLoop() {
      if (!state.motionOn) {
        drawStatic();
        return;
      }
      if (!running) {
        running = true;
        motion.add(step);
      }
      scheduleNext();
    }

    function stopLoop() {
      window.clearTimeout(holdTimer);
      if (running) {
        running = false;
        motion.remove(step);
      }
    }

    sizeCanvas();
    if (state.motionOn) {
      buildParticlesForTarget(0, true);
      startLoop();
    } else {
      drawStatic();
    }

    canvas.addEventListener("click", () => {
      if (!state.motionOn) return;
      cycleIdx = (cycleIdx + 1) % DATA.copy.heroCycle.length;
      buildParticlesForTarget(cycleIdx, false);
      scheduleNext();
    });

    if (window.matchMedia && window.matchMedia("(pointer: fine)").matches) {
      canvas.addEventListener("pointermove", e => {
        const r = canvas.getBoundingClientRect();
        pointerX = e.clientX - r.left;
        pointerY = e.clientY - r.top;
      }, { passive: true });
      canvas.addEventListener("pointerleave", () => {
        pointerX = -9999;
        pointerY = -9999;
      });
    }

    const io = new IntersectionObserver(entries => {
      for (const entry of entries) {
        inView = entry.intersectionRatio >= 0.1;
        if (inView && state.motionOn) startLoop();
        else stopLoop();
      }
    }, { threshold: [0, 0.1] });
    io.observe(canvas);

    let rTimer = 0;
    const ro = new ResizeObserver(() => {
      window.clearTimeout(rTimer);
      rTimer = window.setTimeout(() => {
        const wasMob = isMobile;
        sizeCanvas();
        if (!state.motionOn) drawStatic();
        else if (wasMob !== isMobile) buildParticlesForTarget(cycleIdx, false);
      }, 150);
    });
    ro.observe(canvas);

    const onMotionChange = () => {
      if (state.motionOn) {
        cycleIdx = 0;
        buildParticlesForTarget(0, true);
        startLoop();
      } else {
        stopLoop();
        drawStatic();
      }
    };
    window.addEventListener("raster:motionchange", onMotionChange);

    state.routeCleanup.push(() => {
      stopLoop();
      io.disconnect();
      ro.disconnect();
      window.clearTimeout(rTimer);
      window.removeEventListener("raster:motionchange", onMotionChange);
    });
  }

  // L3a Stats + Countdown
  function initStatsAndCountdown() {
    const statsWrap = document.getElementById("stats-items");
    const statsData = [
      { val: 5, label: "years of AFJ Cardiff" },
      { val: DATA.tracks.length, label: "programme pillars" },
      { val: DATA.sessions.length, label: "evening moments" },
      { val: 15, label: "early bird (£15)" },
      { val: 20, label: "general (£20)" }
    ];

    statsWrap.innerHTML = statsData.map((s, idx) => `
      <div class="stat-item" data-sidx="${idx}">
        <div class="stat-glyph">${svgBitmapText(String(s.val).padStart(2, "0"), 10, DATA.tokens.sodium, { className: "stat-svg", ariaHidden: true, bold: true })}</div>
        <p class="t-small t-sodium stat-label">${esc(s.label)}</p>
      </div>
    `).join("");

    // Count up once when 50% visible
    if (state.motionOn) {
      const io = new IntersectionObserver(entries => {
        for (const entry of entries) {
          if (entry.isIntersecting) {
            io.disconnect();
            statsData.forEach((s, idx) => {
              const box = statsWrap.querySelector(`[data-sidx="${idx}"] .stat-glyph`);
              if (!box) return;
              window.setTimeout(() => {
                let step = 0;
                const timer = window.setInterval(() => {
                  step++;
                  const cur = step >= 12 ? s.val : Math.round((s.val * step) / 12);
                  box.innerHTML = svgBitmapText(String(cur).padStart(2, "0"), 10, DATA.tokens.sodium, { className: "stat-svg", ariaHidden: true, bold: true });
                  if (step >= 12) window.clearInterval(timer);
                }, 100);
              }, idx * 80);
            });
          }
        }
      }, { threshold: 0.5 });
      io.observe(statsWrap);
      state.routeCleanup.push(() => io.disconnect());
    }

    // Countdown
    const cdWrap = document.getElementById("countdown-wrap");
    const srEl = document.getElementById("countdown-sr");
    const targetMs = Date.parse(DATA.meta.firstTalkUTC);
    let cdTimer = 0;
    let lastMinuteText = "";

    function cdCellH() {
      const w = window.innerWidth;
      const avail = cdWrap.clientWidth || (w - 48);
      let target = 5;
      if (w >= 1440) target = 12;
      else if (w >= 1024) target = 10;
      else if (w >= 768) target = 8;
      else if (w >= 390) target = 6;
      if (w >= 768) {
        const maxFit = Math.floor((avail / (81 * 1.25)) * 2) / 2;
        return Math.max(4, Math.min(target, maxFit));
      }
      return target;
    }

    function renderCountdown() {
      const diff = Math.max(0, targetMs - Date.now());
      const totalSec = Math.floor(diff / 1000);
      const d = Math.floor(totalSec / 86400);
      const h = Math.floor((totalSec % 86400) / 3600);
      const m = Math.floor((totalSec % 3600) / 60);
      const s = totalSec % 60;
      const ch = cdCellH();
      const parts = [
        { val: String(d).padStart(3, "0"), label: "days", sep: ":" },
        { val: String(h).padStart(2, "0"), label: "hours", sep: window.innerWidth < 768 ? "" : ":" },
        { val: String(m).padStart(2, "0"), label: "minutes", sep: ":" },
        { val: String(s).padStart(2, "0"), label: "seconds", sep: "" }
      ];

      if (window.innerWidth < 768) {
        cdWrap.innerHTML = `
          <div class="countdown-row">
            <div class="cd-pair">
              <div class="cd-group">${svgBitmapText(parts[0].val, ch, DATA.tokens.sodium, { ariaHidden: true, bold: true })}<span class="t-micro cd-group-label">${parts[0].label}</span></div>
              <div style="margin:0 4px;">${svgBitmapText(":", ch, DATA.tokens.sodium, { ariaHidden: true, bold: true })}</div>
              <div class="cd-group">${svgBitmapText(parts[1].val, ch, DATA.tokens.sodium, { ariaHidden: true, bold: true })}<span class="t-micro cd-group-label">${parts[1].label}</span></div>
            </div>
            <div class="cd-pair" style="width:100%;">
              <div class="cd-group">${svgBitmapText(parts[2].val, ch, DATA.tokens.sodium, { ariaHidden: true, bold: true })}<span class="t-micro cd-group-label">${parts[2].label}</span></div>
              <div style="margin:0 4px;">${svgBitmapText(":", ch, DATA.tokens.sodium, { ariaHidden: true, bold: true })}</div>
              <div class="cd-group">${svgBitmapText(parts[3].val, ch, DATA.tokens.sodium, { ariaHidden: true, bold: true })}<span class="t-micro cd-group-label">${parts[3].label}</span></div>
            </div>
          </div>
          ${diff === 0 ? `<p class="t-small t-sodium" style="margin-top:16px;">${esc(DATA.copy.countdownOver)}</p>` : ""}
        `;
      } else {
        cdWrap.innerHTML = `
          <div class="countdown-row">
            ${parts.map((pt, i) => `
              <div class="cd-pair">
                <div class="cd-group">
                  ${svgBitmapText(pt.val, ch, DATA.tokens.sodium, { ariaHidden: true, bold: true })}
                  <span class="t-micro cd-group-label">${pt.label}</span>
                </div>
                ${i < 3 ? `<div style="margin:0 ${Math.floor(ch * 0.8)}px;">${svgBitmapText(":", ch, DATA.tokens.sodium, { ariaHidden: true, bold: true })}</div>` : ""}
              </div>
            `).join("")}
          </div>
          ${diff === 0 ? `<p class="t-small t-sodium" style="margin-top:16px;">${esc(DATA.copy.countdownOver)}</p>` : ""}
        `;
      }

      const minText = `${d} days, ${h} hours, ${m} minutes until doors open`;
      if (minText !== lastMinuteText) {
        lastMinuteText = minText;
        srEl.textContent = minText;
      }

      const msToNext = 1000 - (Date.now() % 1000) + 10;
      cdTimer = window.setTimeout(renderCountdown, msToNext);
    }

    renderCountdown();
    const onResize = () => {
      window.clearTimeout(cdTimer);
      renderCountdown();
    };
    window.addEventListener("resize", onResize, { passive: true });
    state.routeCleanup.push(() => {
      window.clearTimeout(cdTimer);
      window.removeEventListener("resize", onResize);
    });
  }

  // L4 Track Panels (Ref B)
  function initTrackPanels() {
    const grid = document.getElementById("tracks-grid");

    const weavePlus = (x, y, phase) => {
      const px = (x + phase) % 6;
      const py = (y + phase) % 6;
      const inA = (px === 1 && py <= 2) || (py === 1 && px <= 2);
      const inB = (px === 4 && py >= 3) || (py === 4 && px >= 3);
      return (inA || inB) ? 1 : 0;
    };

    const weaveCross = (x, y, phase) => {
      const px = (x + phase) % 4;
      const py = (y + phase) % 4;
      return (px === 1 || py === 1) ? 1 : 0;
    };

    const weaveTartan = (x, y, phase) => {
      const px = (x + phase) % 4;
      const py = (y + phase) % 4;
      return ((px < 2) !== (py < 2) || (px === 1 && py === 1)) ? 1 : 0;
    };

    const weaveBasket = (x, y, phase) => {
      const px = (x + phase) % 4;
      const py = (y + phase) % 4;
      const block = ((Math.floor((x + phase) / 4) + Math.floor((y + phase) / 4)) % 2) === 0;
      return block ? (py % 2 === 0 ? 1 : 0) : (px % 2 === 0 ? 1 : 0);
    };

    const PANEL_STYLES = {
      film: {
        colA: "#FF8560",
        colB: "#BE110E",
        band: "#FF8560",
        fg: "#080808",
        weave: weavePlus
      },
      panel: {
        colA: "#F7F40F",
        colB: "#BE110E",
        band: "#F7F40F",
        fg: "#080808",
        weave: weaveCross
      },
      live: {
        colA: "#C13952",
        colB: "#CC9A39",
        band: "#C13952",
        fg: "#FFFFFF",
        weave: weaveBasket
      },
      fashion: {
        colA: "#CC9A39",
        colB: "#CF7946",
        band: "#CC9A39",
        fg: "#080808",
        weave: weaveTartan
      }
    };

    grid.innerHTML = DATA.tracks.map(t => {
      const count = sessionsByTrack(t.id).length;
      const aria = `${t.label}: ${count} parts. Open schedule filtered by ${t.label}.`;
      const style = PANEL_STYLES[t.id];
      return `
        <div class="track-fig">
          <button type="button" class="track-panel-btn" data-track="${esc(t.id)}" style="--track-band:${style.band};--track-fg:${style.fg}" aria-label="${esc(aria)}">
            <svg class="track-panel-svg" viewBox="0 0 80 72" shape-rendering="crispEdges" aria-hidden="true"></svg>
            <div class="track-card-body">
              <div>
                <p class="track-card-title">${esc(t.label)}</p>
                <p class="t-small track-card-desc">${esc(t.desc)}</p>
              </div>
              <div class="track-card-foot">
                <span class="t-micro">${count} ${count === 1 ? "part" : "parts"}</span>
                <svg class="track-card-arrow" width="14" height="14" viewBox="0 0 14 14" fill="none" aria-hidden="true">
                  <path d="M2 12L12 2M12 2H4M12 2V10" stroke="currentColor" stroke-width="1.6" stroke-linecap="square"/>
                </svg>
              </div>
            </div>
          </button>
        </div>
      `;
    }).join("");

    const controllers = [];
    DATA.tracks.forEach(t => {
      const btn = grid.querySelector(`.track-panel-btn[data-track="${t.id}"]`);
      const svg = btn.querySelector(".track-panel-svg");
      const panel = PANEL_STYLES[t.id];
      const cell = 4;
      const cols = 20;
      const rows = 18;
      let busy = false;
      let animTimer = 0;

      function drawGrid(phase) {
        let out = `<rect x="0" y="0" width="${cols * cell}" height="${rows * cell}" fill="${panel.colA}"/>`;
        for (let y = 0; y < rows; y++) {
          for (let x = 0; x < cols; x++) {
            if (panel.weave(x, y, phase) === 1) {
              out += `<rect x="${x * cell}" y="${y * cell}" width="${cell}" height="${cell}" fill="${panel.colB}"/>`;
            }
          }
        }
        svg.innerHTML = out;
      }

      drawGrid(0);

      function play() {
        if (!state.motionOn || busy) return;
        busy = true;
        let step = 0;
        animTimer = window.setInterval(() => {
          step++;
          drawGrid(step % 6);
          if (step >= 6) {
            window.clearInterval(animTimer);
            drawGrid(0);
            busy = false;
          }
        }, 90);
      }

      btn.addEventListener("mouseenter", play);
      btn.addEventListener("focus", play);
      btn.addEventListener("click", () => {
        state.filters.tracks = [t.id];
        state.filters.agendaOnly = false;
        storageSet("afj5.filters", state.filters);
        window.location.hash = "#/schedule";
      });

      const io = new IntersectionObserver(entries => {
        for (const entry of entries) {
          if (entry.isIntersecting) {
            io.disconnect();
            play();
          }
        }
      }, { threshold: 0.4 });
      io.observe(btn);

      state.routeCleanup.push(() => {
        io.disconnect();
        window.clearInterval(animTimer);
        window.clearTimeout(animTimer);
      });

      controllers.push(play);
    });

    const idleTimer = window.setInterval(() => {
      if (!state.motionOn || document.hidden) return;
      const fn = controllers[Math.floor(Math.random() * controllers.length)];
      if (fn) fn();
    }, 6000);
    state.routeCleanup.push(() => window.clearInterval(idleTimer));
  }

        window.clearInterval(timer);
        let steps = 0;
        timer = window.setInterval(() => {
          phase = (phase + 1) % 6;
          draw();
          steps++;
          if (steps >= 3) window.clearInterval(timer);
        }, 85);
      });

      state.routeCleanup.push(() => window.clearInterval(timer));

    const agendaBtn = document.getElementById("sched-agenda-btn");
    const remToolbarBtn = document.getElementById("sched-reminders-toggle");
    const remCfgBtn = document.getElementById("sched-reminders-cfg-btn");
    const remPanel = document.getElementById("sched-reminders-panel");
    const remPanelToggle = document.getElementById("rem-panel-toggle");
    const remPermBtn = document.getElementById("rem-perm-btn");
    const remPermStatus = document.getElementById("rem-perm-status");
    const remMinInput = document.getElementById("rem-minutes-input");
    const remPresetBtns = Array.from(document.querySelectorAll("[data-rem-preset]"));
    const remNoteInput = document.getElementById("rem-note-input");
    const remArmedSummary = document.getElementById("rem-armed-summary");
    const remArmedList = document.getElementById("rem-armed-list");
    const remTestBtn = document.getElementById("rem-test-btn");
    const tlBtn = document.getElementById("view-timeline-btn");
    const tblBtn = document.getElementById("view-table-btn");
    const icsBtn = document.getElementById("sched-ics-btn");
    const countEl = document.getElementById("sched-count");
    const bodyEl = document.getElementById("sched-body");

    function refreshReminderUI() {
      const en = Boolean(state.reminders.enabled);
      const mins = state.reminders.minutesBefore || 15;
      remToolbarBtn.setAttribute("aria-pressed", en ? "true" : "false");
      remToolbarBtn.innerHTML = `${svgPixelIcon("bell", 12)}<span>${en ? `(Reminders: on · ${mins}m)` : "(Reminders: off)"}</span>`;
      remPanelToggle.setAttribute("aria-pressed", en ? "true" : "false");
      remPanelToggle.textContent = en ? "(Notifications: active)" : "(Notifications: paused)";
      remCfgBtn.setAttribute("aria-expanded", state.remindersPanelOpen ? "true" : "false");
      remPanel.classList.toggle("is-open", state.remindersPanelOpen);
      remMinInput.value = String(mins);
      remPresetBtns.forEach(b => b.setAttribute("aria-pressed", Number(b.dataset.remPreset) === mins ? "true" : "false"));

      if (!("Notification" in window)) {
        remPermStatus.textContent = "Browser notifications unavailable here — in-app alert banner active.";
        remPermBtn.hidden = true;
      } else if (Notification.permission === "granted") {
        remPermStatus.textContent = "Browser notifications permitted + in-app alert banner active.";
        remPermBtn.hidden = true;
      } else if (Notification.permission === "denied") {
        remPermStatus.textContent = "Browser notifications blocked — in-app alert banner will still fire while open.";
        remPermBtn.hidden = false;
      } else {
        remPermStatus.textContent = "Browser notification permission not yet granted (in-app banner always active).";
        remPermBtn.hidden = false;
      }

      const armed = getArmedAgendaSessions();
      if (armed.length === 0) {
        remArmedSummary.textContent = "No sessions saved in your agenda yet. Press + on any session below to arm reminders.";
        remArmedList.innerHTML = "";
      } else {
        remArmedSummary.textContent = `${armed.length} saved ${armed.length === 1 ? "session" : "sessions"} ${en ? "armed" : "ready (toggle on to arm)"} · Alerts fire ${mins} min prior (Sat 5 Dec):`;
        remArmedList.innerHTML = armed.slice(0, 4).map(item => `
          <div class="reminders-armed-item t-micro">
            <span>${esc(item.session.title)}</span>
            <span class="tnum">Alert ${formatReminderTimeGMT(item.triggerDate)}</span>
          </div>
        `).join("") + (armed.length > 4 ? `<p class="t-micro" style="margin-top:6px;">+ ${armed.length - 4} more saved sessions</p>` : "");
      }
    }

    function getFilteredSessions() {
      const dayAll = sessionsByDay(state.filters.day);
      const filtered = dayAll.filter(s => {
        if (state.filters.tracks.length > 0 && !state.filters.tracks.includes(s.track)) return false;
        if (state.filters.agendaOnly && !state.agenda.includes(s.id)) return false;
        return true;
      });
      return { dayAll, filtered: filtered.sort((a, b) => timeToMin(a.start) - timeToMin(b.start)) };
    }

    function renderScheduleBody(animateEntrance) {
      const dayObj = dayById(state.filters.day);
      const { dayAll, filtered } = getFilteredSessions();
      const breaks = DATA.breaks.filter(b => b.day === state.filters.day);
      countEl.textContent = `${filtered.length} of ${dayAll.length} sessions shown`;

      if (filtered.length === 0) {
        const emptyIcon = (() => {
          let r = `<rect x="0" y="0" width="9" height="9" fill="none" stroke="${DATA.tokens.ink}" stroke-width="1"/>`;
          r += `<line x1="3" y1="0" x2="3" y2="9" stroke="${DATA.tokens.ink}" stroke-width="0.5"/>`;
          r += `<line x1="6" y1="0" x2="6" y2="9" stroke="${DATA.tokens.ink}" stroke-width="0.5"/>`;
          r += `<line x1="0" y1="3" x2="9" y2="3" stroke="${DATA.tokens.ink}" stroke-width="0.5"/>`;
          r += `<line x1="0" y1="6" x2="9" y2="6" stroke="${DATA.tokens.ink}" stroke-width="0.5"/>`;
          return `<svg width="45" height="45" viewBox="0 0 9 9" shape-rendering="crispEdges" aria-hidden="true">${r}</svg>`;
        })();
        const msg = state.filters.agendaOnly && state.agenda.length === 0
          ? "Your agenda is empty. Press + on any session to add it."
          : "Nothing on this day with these filters.";
        bodyEl.innerHTML = `
          <div class="schedule-empty">
            ${emptyIcon}
            <p class="t-lead">${esc(msg)}</p>
            <button type="button" class="btn-text t-small u-anim" id="sched-clear-btn">(Clear filters)</button>
          </div>
        `;
        document.getElementById("sched-clear-btn").addEventListener("click", () => {
          state.filters.tracks = [];
          state.filters.agendaOnly = false;
          storageSet("afj5.filters", state.filters);
          trackBtns.forEach(b => b.setAttribute("aria-pressed", "false"));
          agendaBtn.setAttribute("aria-pressed", "false");
          renderScheduleBody(false);
        });
        return;
      }

      if (state.filters.view === "table") {
        const items = [];
        filtered.forEach(s => items.push({ kind: "session", start: s.start, end: s.end, rec: s }));
        breaks.forEach(b => items.push({ kind: "break", start: b.start, end: b.end, rec: b }));
        items.sort((a, b) => timeToMin(a.start) - timeToMin(b.start));

        bodyEl.innerHTML = `
          <table class="data-table responsive-table">
            <caption class="t-micro">${esc(dayObj.fullLabel)}, ${items.length} items</caption>
            <thead>
              <tr>
                <th class="t-micro">Time</th>
                <th class="t-micro">Room</th>
                <th class="t-micro">Type</th>
                <th class="t-micro">Title</th>
                <th class="t-micro">Speakers</th>
                <th class="t-micro">Track</th>
                <th class="t-micro">Agenda</th>
              </tr>
            </thead>
            <tbody>
              ${items.map(it => {
                if (it.kind === "break") {
                  const b = it.rec;
                  const r = roomById(b.room);
                  return `<tr>
                    <td data-label="Time" class="t-small tnum">${fmtTime(b.start)}–${fmtTime(b.end)}</td>
                    <td data-label="Room" class="t-small">${esc(r.name)}</td>
                    <td data-label="Type" class="t-small">Break</td>
                    <td data-label="Title" class="t-small">${esc(b.title)}</td>
                    <td data-label="Speakers" class="t-small">—</td>
                    <td data-label="Track" class="t-small">—</td>
                    <td data-label="Agenda" class="t-small">—</td>
                  </tr>`;
                }
                const s = it.rec;
                const r = roomById(s.room);
                const tr = trackById(s.track);
                const added = state.agenda.includes(s.id);
                const clash = hasClash(s);
                const spks = s.speakers.map(id => `<a class="u-anim" href="#/speakers/${esc(id)}">${esc(speakerById(id).name)}</a>`).join(", ");
                return `<tr>
                  <td data-label="Time" class="t-small tnum">${fmtTime(s.start)}–${fmtTime(s.end)}</td>
                  <td data-label="Room" class="t-small">${esc(r.name)}</td>
                  <td data-label="Type" class="t-small">${esc(s.type)}</td>
                  <td data-label="Title" class="t-small fw-600"><a class="u-anim" href="#/talks/${esc(s.id)}">${esc(s.title)}</a>${clash ? ` <span class="clash-chip t-micro">Clash</span>` : ""}</td>
                  <td data-label="Speakers" class="t-small">${spks}</td>
                  <td data-label="Track" class="t-small"><span class="track-chip track-chip-${esc(s.track)}">${esc(tr.label)}</span></td>
                  <td data-label="Agenda" class="t-small">
                    <button type="button" class="tl-agenda-btn" data-ag="${esc(s.id)}" aria-pressed="${added ? "true" : "false"}" aria-label="${added ? "Remove" : "Add"} ${esc(s.title)} ${added ? "from" : "to"} my agenda">${svgPixelIcon(added ? "check" : "plus", 14)}</button>
                  </td>
                </tr>`;
              }).join("")}
            </tbody>
          </table>
        `;
      } else if (window.innerWidth < 768) {
        // Mobile chronological list
        const items = [];
        filtered.forEach(s => items.push({ kind: "session", start: s.start, rec: s }));
        breaks.forEach(b => items.push({ kind: "break", start: b.start, rec: b }));
        items.sort((a, b) => timeToMin(a.start) - timeToMin(b.start));

        bodyEl.innerHTML = `<div class="schedule-mobile-list">
          ${items.map((it, idx) => {
            if (it.kind === "break") {
              const b = it.rec;
              const r = roomById(b.room);
              return `<div class="tl-break t-micro"><span>${fmtTime(b.start)}–${fmtTime(b.end)} · ${esc(b.title)}</span><span>${esc(r.name)}</span></div>`;
            }
            const s = it.rec;
            const r = roomById(s.room);
            const added = state.agenda.includes(s.id);
            const clash = hasClash(s);
            const spks = s.speakers.map(id => speakerById(id).name).join(", ");
            const stagger = animateEntrance && state.motionOn ? ` style="transition-delay:${Math.min(idx, 7) * 40}ms"` : "";
            return `<article class="tl-session${added ? " is-added" : ""}${clash ? " is-clash" : ""}" data-track="${esc(s.track)}" data-sid="${esc(s.id)}"${stagger}>
              <div class="tl-session-top">
                <div>
                  <div class="t-micro tnum">${fmtTime(s.start)}–${fmtTime(s.end)} · ${esc(s.type)} · ${esc(r.name)}</div>
                  <h2 class="t-small fw-600" style="margin-top:4px;">${esc(s.title)}</h2>
                  <div class="t-micro" style="margin-top:4px;">${esc(spks)}</div>
                  ${clash ? `<div style="margin-top:6px;"><span class="clash-chip t-micro">Clash</span></div>` : ""}
                </div>
                <button type="button" class="tl-agenda-btn" data-ag="${esc(s.id)}" aria-pressed="${added ? "true" : "false"}" aria-label="${added ? "Remove" : "Add"} ${esc(s.title)} ${added ? "from" : "to"} my agenda">${svgPixelIcon(added ? "check" : "plus", 14)}</button>
              </div>
            </article>`;
          }).join("")}
        </div>`;
      } else {
        // Desktop / Tablet 15-min CSS grid timeline (16:00 to 21:00 = 20 rows)
        let hourMarks = "";
        for (let h = 16; h <= 21; h++) {
          const row = (h - 16) * 4 + 2;
          hourMarks += `<div class="tl-hour-line" style="grid-row:${row};"></div>`;
          hourMarks += `<div class="tl-hour-label t-micro tnum" style="grid-row:${row} / ${row + 2};">${String(h).padStart(2, "0")}.00</div>`;
        }
        const breakBlocks = breaks.map(b => {
          const rStart = Math.round((timeToMin(b.start) - 960) / 15) + 2;
          const rEnd = Math.round((timeToMin(b.end) - 960) / 15) + 2;
          const rm = roomById(b.room);
          return `<div class="tl-break t-micro" style="grid-row:${rStart} / ${rEnd};">
            <span>${fmtTime(b.start)}–${fmtTime(b.end)} · ${esc(b.title)}</span>
            <span>${esc(rm.name)}</span>
          </div>`;
        }).join("");

        const sessBlocks = filtered.map((s, idx) => {
          const rStart = Math.round((timeToMin(s.start) - 960) / 15) + 2;
          const rEnd = Math.round((timeToMin(s.end) - 960) / 15) + 2;
          const col = s.room === "hall-a" ? 2 : 3;
          const added = state.agenda.includes(s.id);
          const clash = hasClash(s);
          const spks = s.speakers.map(id => speakerById(id).name).join(", ");
          return `<article class="tl-session${added ? " is-added" : ""}${clash ? " is-clash" : ""}" data-track="${esc(s.track)}" data-sid="${esc(s.id)}" style="grid-column:${col};grid-row:${rStart} / ${rEnd};">
            <div class="tl-session-top">
              <div>
                <div class="t-micro tnum">${fmtTime(s.start)}–${fmtTime(s.end)} · ${esc(s.type)}</div>
                <h2 class="t-small fw-600" style="margin-top:2px;">${esc(s.title)}</h2>
                <div class="t-micro" style="margin-top:2px;">${esc(spks)}</div>
              </div>
              <button type="button" class="tl-agenda-btn" data-ag="${esc(s.id)}" aria-pressed="${added ? "true" : "false"}" aria-label="${added ? "Remove" : "Add"} ${esc(s.title)} ${added ? "from" : "to"} my agenda">${svgPixelIcon(added ? "check" : "plus", 14)}</button>
            </div>
            ${clash ? `<div><span class="clash-chip t-micro">Clash</span></div>` : ""}
          </article>`;
        }).join("");

        bodyEl.innerHTML = `
          <div class="timeline-grid">
            <div class="tl-room-head t-micro" style="grid-column:1;">Time</div>
            <div class="tl-room-head t-micro" style="grid-column:2;">Dance House | Tŷ Dawns</div>
            <div class="tl-room-head t-micro" style="grid-column:3;">WMC Foyer & Reception</div>
            ${hourMarks}
            ${breakBlocks}
            ${sessBlocks}
          </div>
        `;
      }

      // Wire agenda toggles and block navigation
      bodyEl.querySelectorAll("[data-ag]").forEach(btn => {
        btn.addEventListener("click", e => {
          e.stopPropagation();
          toggleAgenda(btn.dataset.ag);
          renderScheduleBody(false);
        });
      });
      bodyEl.querySelectorAll(".tl-session[data-sid]").forEach(card => {
        card.addEventListener("click", e => {
          if (e.target.closest("[data-ag]")) return;
          window.location.hash = `#/talks/${card.dataset.sid}`;
        });
        card.addEventListener("pointerenter", () => {
          if (card.scrollHeight > card.clientHeight + 2) {
            const s = sessionById(card.dataset.sid);
            if (s) showTip(card.getBoundingClientRect(), `${fmtTime(s.start)}–${fmtTime(s.end)} · ${s.title}`, false);
          }
        });
        card.addEventListener("pointerleave", hideTip);
      });
    }

    // Tab switching (click + keyboard roving tabindex)
    function selectDay(dayId, moveFocus) {
      state.filters.day = dayId;
      storageSet("afj5.filters", state.filters);
      dayTabs.forEach(t => {
        const active = t.dataset.day === dayId;
        t.setAttribute("aria-selected", active ? "true" : "false");
        t.setAttribute("tabindex", active ? "0" : "-1");
        if (active && moveFocus) t.focus();
      });
      renderScheduleBody(true);
    }

    dayTabs.forEach((tab, idx) => {
      tab.addEventListener("click", () => selectDay(tab.dataset.day, false));
      tab.addEventListener("keydown", e => {
        let nextIdx = -1;
        if (e.key === "ArrowRight") nextIdx = (idx + 1) % dayTabs.length;
        else if (e.key === "ArrowLeft") nextIdx = (idx - 1 + dayTabs.length) % dayTabs.length;
        else if (e.key === "Home") nextIdx = 0;
        else if (e.key === "End") nextIdx = dayTabs.length - 1;
        if (nextIdx >= 0) {
          e.preventDefault();
          selectDay(dayTabs[nextIdx].dataset.day, true);
        }
      });
    });

    trackBtns.forEach(btn => {
      btn.addEventListener("click", () => {
        const tid = btn.dataset.track;
        const i = state.filters.tracks.indexOf(tid);
        if (i === -1) state.filters.tracks.push(tid);
        else state.filters.tracks.splice(i, 1);
        btn.setAttribute("aria-pressed", i === -1 ? "true" : "false");
        storageSet("afj5.filters", state.filters);
        renderScheduleBody(false);
      });
    });

    agendaBtn.addEventListener("click", () => {
      state.filters.agendaOnly = !state.filters.agendaOnly;
      agendaBtn.setAttribute("aria-pressed", state.filters.agendaOnly ? "true" : "false");
      storageSet("afj5.filters", state.filters);
      renderScheduleBody(false);
    });

    const setView = v => {
      state.filters.view = v;
      tlBtn.setAttribute("aria-pressed", v === "timeline" ? "true" : "false");
      tblBtn.setAttribute("aria-pressed", v === "table" ? "true" : "false");
      storageSet("afj5.filters", state.filters);
      renderScheduleBody(false);
    };
    tlBtn.addEventListener("click", () => setView("timeline"));
    tblBtn.addEventListener("click", () => setView("table"));

    icsBtn.addEventListener("click", () => {
      const exportSessions = state.agenda.length > 0
        ? state.agenda.map(id => sessionById(id)).filter(Boolean)
        : getFilteredSessions().filtered;
      const lines = [
        "BEGIN:VCALENDAR",
        "VERSION:2.0",
        "PRODID:-//AFJ Cardiff//Movement as Memory//EN"
      ];
      exportSessions.forEach(s => {
        const d = dayById(s.day);
        const rm = roomById(s.room);
        const ymd = d.date.replace(/-/g, "");
        const toUtc = hhmm => {
          const [hh, mm] = hhmm.split(":").map(Number);
          return String(hh).padStart(2, "0") + String(mm).padStart(2, "0") + "00Z";
        };
        lines.push("BEGIN:VEVENT");
        lines.push(`UID:${s.id}@afjcardiff.org`);
        lines.push(`DTSTAMP:20261127T000000Z`);
        lines.push(`DTSTART:${ymd}T${toUtc(s.start)}`);
        lines.push(`DTEND:${ymd}T${toUtc(s.end)}`);
        lines.push(`SUMMARY:${s.title}`);
        lines.push(`LOCATION:${rm.name}, ${DATA.meta.venue.name}, ${DATA.meta.venue.city}`);
        lines.push(`DESCRIPTION:${s.abstract}`);
        lines.push("END:VEVENT");
      });
      lines.push("END:VCALENDAR");
      const blob = new Blob([lines.join("\r\n")], { type: "text/calendar;charset=utf-8" });
      const blobUrl = URL.createObjectURL(blob);
      const a = document.createElement("a");
      a.href = blobUrl;
      a.download = "afj-cardiff-movement-as-memory.ics";
      document.body.appendChild(a);
      a.click();
      a.remove();
      window.setTimeout(() => URL.revokeObjectURL(blobUrl), 1000);
    });

    const onAgendaChange = () => refreshReminderUI();
    window.addEventListener("afj:agendachange", onAgendaChange);

    async function toggleRemindersEnabled() {
      state.reminders.enabled = !state.reminders.enabled;
      if (state.reminders.enabled) {
        state.remindersPanelOpen = true;
        await requestBrowserNotificationPermission();
      }
      saveRemindersState();
      refreshReminderUI();
      evaluateAgendaReminders();
    }

    remToolbarBtn.addEventListener("click", toggleRemindersEnabled);
    remPanelToggle.addEventListener("click", toggleRemindersEnabled);
    remCfgBtn.addEventListener("click", () => {
      state.remindersPanelOpen = !state.remindersPanelOpen;
      refreshReminderUI();
    });
    remPermBtn.addEventListener("click", async () => {
      await requestBrowserNotificationPermission();
      refreshReminderUI();
    });

    const setLeadMinutes = val => {
      const num = Math.min(180, Math.max(1, Math.round(Number(val) || 15)));
      state.reminders.minutesBefore = num;
      saveRemindersState();
      refreshReminderUI();
      evaluateAgendaReminders();
    };

    remMinInput.addEventListener("change", () => setLeadMinutes(remMinInput.value));
    remPresetBtns.forEach(b => {
      b.addEventListener("click", () => setLeadMinutes(b.dataset.remPreset));
    });
    remNoteInput.addEventListener("input", () => {
      state.reminders.customNote = remNoteInput.value.slice(0, 120);
      saveRemindersState();
    });
    remTestBtn.addEventListener("click", async () => {
      if ("Notification" in window && Notification.permission === "default") {
        await requestBrowserNotificationPermission();
        refreshReminderUI();
      }
      const armed = getArmedAgendaSessions();
      const targetSession = armed.length > 0 ? armed[0].session : (sessionById("s03") || DATA.sessions[0]);
      fireSessionReminder(targetSession, { isTest: true });
    });

    const onResize = () => renderScheduleBody(false);
    window.addEventListener("resize", onResize, { passive: true });
    state.routeCleanup.push(() => {
      window.removeEventListener("resize", onResize);
      window.removeEventListener("afj:agendachange", onAgendaChange);
    });

    refreshReminderUI();
    renderScheduleBody(true);
  }

  // Route 3: Highlights / Pillars Index (#/speakers)
  function renderSpeakers(main) {
    document.title = "Highlights" + DATA.copy.siteTitleSuffix;
    main.innerHTML = `
      <section class="sub-sec" data-surface="sodium" data-pager="Highlights">
        <div class="grid">
          <p class="col-1-3 t-micro">(Highlights)</p>
          <div class="col-5-12">
            <h1 class="t-h1" tabindex="-1">${esc(DATA.copy.speakersTitle)}</h1>
            <p class="t-body" style="margin-top:16px;">${esc(DATA.copy.speakersLeadPage)}</p>
            <div style="margin-top:24px;display:flex;flex-wrap:wrap;gap:12px;align-items:center;">
              <div class="track-toggles-wrap" id="spk-track-toggles">
                ${DATA.tracks.map(t => {
                  const pressed = state.speakersFilter.tracks.includes(t.id);
                  return `<button type="button" class="chip-toggle t-small" data-track="${esc(t.id)}" aria-pressed="${pressed ? "true" : "false"}">
                    <svg width="10" height="10" viewBox="0 0 10 10" shape-rendering="crispEdges" aria-hidden="true"><rect x="0" y="0" width="10" height="10" fill="${DATA.tokens.ink}"/><rect x="1" y="1" width="8" height="8" fill="${t.chipBg}"/></svg>
                    (${esc(t.label)})
                  </button>`;
                }).join("")}
              </div>
              <div class="seg-group" role="group" aria-label="Sort highlights">
                <button type="button" class="chip-toggle t-small" id="spk-sort-az" aria-pressed="${state.speakersFilter.sort === "az" ? "true" : "false"}">(A–Z)</button>
                <button type="button" class="chip-toggle t-small" id="spk-sort-day" aria-pressed="${state.speakersFilter.sort === "day" ? "true" : "false"}">(By time)</button>
              </div>
            </div>
          </div>
          <div class="col-full" id="spk-grid-wrap"></div>
        </div>
      </section>
    `;

    const gridWrap = document.getElementById("spk-grid-wrap");
    const trackBtns = Array.from(document.querySelectorAll("#spk-track-toggles .chip-toggle"));
    const azBtn = document.getElementById("spk-sort-az");
    const dayBtn = document.getElementById("spk-sort-day");

    function firstSessionOrder(sp) {
      const list = sessionsBySpeaker(sp.id).slice().sort((a, b) => {
        if (a.day !== b.day) return a.day.localeCompare(b.day);
        return timeToMin(a.start) - timeToMin(b.start);
      });
      const first = list[0];
      if (!first) return 999999;
      return Number(first.day[1]) * 10000 + timeToMin(first.start);
    }

    function drawList(skipFade) {
      let list = DATA.speakers.filter(sp =>
        state.speakersFilter.tracks.length === 0 || state.speakersFilter.tracks.includes(sp.track)
      );
      if (state.speakersFilter.sort === "az") {
        list = list.slice().sort((a, b) => a.name.localeCompare(b.name));
      } else {
        list = list.slice().sort((a, b) => firstSessionOrder(a) - firstSessionOrder(b));
      }

      if (list.length === 0) {
        gridWrap.innerHTML = `<p class="t-lead" style="margin-top:48px;">No programme highlights in this pillar.</p>`;

      const doRender = () => {
        gridWrap.innerHTML = `<div class="speakers-index-grid">

            const tr = trackById(sp.track);
            const sess = sessionsBySpeaker(sp.id);
            return `<figure class="speaker-card" data-spcard="${esc(sp.id)}">
              <a class="speaker-card-link" href="#/speakers/${esc(sp.id)}">
                <canvas class="portrait-canvas" data-spid="${esc(sp.id)}" role="img" aria-label="Pixel portrait of ${esc(sp.name)}"></canvas>
              </a>
              <figcaption class="speaker-card-figcap">
                <h2 class="t-lead speaker-card-name"><a class="u-anim" href="#/speakers/${esc(sp.id)}">${esc(sp.name)}</a></h2>

                <p class="t-micro" style="margin-top:4px;">${esc(sp.city)} · <span class="track-chip track-chip-${esc(sp.track)}">${esc(tr.label)}</span></p>

        </div>`;

          const canvas = gridWrap.querySelector(`canvas[data-spid="${sp.id}"]`);
          if (canvas) initPortraitCanvas(canvas, sp, { skipAssemble: !skipFade });
        });
      };

      const existing = Array.from(gridWrap.querySelectorAll(".speaker-card"));
      if (!skipFade && state.motionOn && existing.length > 0) {
        const keepIds = new Set(list.map(s => s.id));
        const leaving = existing.filter(el => !keepIds.has(el.dataset.spcard));
        if (leaving.length > 0) {
          leaving.forEach(el => el.classList.add("is-leaving"));
          window.setTimeout(doRender, 160);
          return;
        }
      }
      doRender();
    }

    trackBtns.forEach(btn => {
      btn.addEventListener("click", () => {
        const tid = btn.dataset.track;
        const i = state.speakersFilter.tracks.indexOf(tid);
        if (i === -1) state.speakersFilter.tracks.push(tid);

        btn.setAttribute("aria-pressed", i === -1 ? "true" : "false");
        drawList(false);

    });

    azBtn.addEventListener("click", () => {
      state.speakersFilter.sort = "az";
      azBtn.setAttribute("aria-pressed", "true");
      dayBtn.setAttribute("aria-pressed", "false");
      drawList(false);

    dayBtn.addEventListener("click", () => {
      state.speakersFilter.sort = "day";
      azBtn.setAttribute("aria-pressed", "false");
      dayBtn.setAttribute("aria-pressed", "true");
      drawList(false);
    });

    drawList(true);
  }

                    <svg width="10" height="10" viewBox="0 0 10 10" shape-rendering="crispEdges" aria-hidden="true"><rect x="0" y="0" width="10" height="10" fill="${DATA.tokens.ink}"/><rect x="1" y="1" width="8" height="8" fill="${t.chipBg}"/></svg>
                    (${esc(t.label)})
                  </button>`;
                }).join("")}
              </div>
            </div>
            <p class="t-micro" id="talks-count" aria-live="polite"></p>
          </div>
          <div class="col-full" id="talks-table-wrap"></div>
        </div>
      </section>
    `;

    const searchInput = document.getElementById("talks-search");
    const typeBtns = Array.from(document.querySelectorAll("#talks-type-toggles .chip-toggle"));
    const trackBtns = Array.from(document.querySelectorAll("#talks-track-toggles .chip-toggle"));
    const countEl = document.getElementById("talks-count");
    const wrapEl = document.getElementById("talks-table-wrap");

    function highlightText(text, query) {
      if (!query) return esc(text);
      const normQ = normText(query.trim());
      if (!normQ) return esc(text);
      const normStr = normText(text);
      // Match indices on normalized string (note: length matches for standard latin diacritics)
      let out = "";
      let pos = 0;
      const rawChars = Array.from(text);
      const normChars = rawChars.map(c => normText(c));
      const flatNorm = normChars.join("");
      let idx = flatNorm.indexOf(normQ);
      if (idx === -1) return esc(text);
      // Map char offsets back safely
      const mapStart = [];
      let acc = 0;
      for (let i = 0; i < rawChars.length; i++) {
        for (let k = 0; k < normChars[i].length; k++) mapStart.push(i);
        acc += normChars[i].length;
      }
      mapStart.push(rawChars.length);
      while (idx !== -1) {
        const rawS = mapStart[idx];
        const rawE = mapStart[idx + normQ.length];
        out += esc(rawChars.slice(pos, rawS).join(""));
        out += `<mark>${esc(rawChars.slice(rawS, rawE).join(""))}</mark>`;
        pos = rawE;
        idx = flatNorm.indexOf(normQ, idx + normQ.length);
      }
      out += esc(rawChars.slice(pos).join(""));
      return out;
    }

    function renderTable() {
      const q = normText(state.talksFilter.query.trim());
      let list = DATA.sessions.filter(s => {
        if (state.talksFilter.types.length > 0 && !state.talksFilter.types.includes(s.type)) return false;
        if (state.talksFilter.tracks.length > 0 && !state.talksFilter.tracks.includes(s.track)) return false;
        if (q) {
          const spkNames = s.speakers.map(id => speakerById(id).name).join(" ");
          const hay = normText(`${s.title} ${s.abstract} ${spkNames}`);
          if (!hay.includes(q)) return false;
        }
        return true;
      });

      const dir = state.talksFilter.sortDir === "asc" ? 1 : -1;
      const col = state.talksFilter.sortCol;
      list.sort((a, b) => {
        if (col === "id") return a.id.localeCompare(b.id) * dir;
        if (col === "title") return a.title.localeCompare(b.title) * dir;
        const da = Number(a.day[1]) * 10000 + timeToMin(a.start);
        const db = Number(b.day[1]) * 10000 + timeToMin(b.start);
        return (da - db) * dir;
      });

      countEl.textContent = `${list.length} of ${DATA.sessions.length} sessions`;

      if (list.length === 0) {
        wrapEl.innerHTML = `
          <div class="schedule-empty">
            <p class="t-lead">No session matches “${esc(state.talksFilter.query)}”.</p>
            <button type="button" class="btn-text t-small u-anim" id="talks-clear-btn">(Clear search)</button>
          </div>
