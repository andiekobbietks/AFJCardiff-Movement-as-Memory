        document.getElementById("talks-clear-btn").addEventListener("click", () => {
          state.talksFilter.query = "";
          state.talksFilter.types = [];
          state.talksFilter.tracks = [];
          searchInput.value = "";
          typeBtns.forEach(b => b.setAttribute("aria-pressed", "false"));
          trackBtns.forEach(b => b.setAttribute("aria-pressed", "false"));
          renderTable();
        });
        return;
      }

      const sortCap = col === "id" ? "number" : col === "title" ? "title" : "day and time";
      const triSvg = activeCol => {
        if (state.talksFilter.sortCol !== activeCol) return "";
        const icon = state.talksFilter.sortDir === "asc" ? "tri-up" : "tri-down";
        return `<svg width="10" height="6" viewBox="0 0 5 3" shape-rendering="crispEdges" fill="currentColor" aria-hidden="true">${
          icon === "tri-up"
            ? `<rect x="2" y="0" width="1" height="1"/><rect x="1" y="1" width="3" height="1"/><rect x="0" y="2" width="5" height="1"/>`
            : `<rect x="0" y="0" width="5" height="1"/><rect x="1" y="1" width="3" height="1"/><rect x="2" y="2" width="1" height="1"/>`
        }</svg>`;
      };
      const ariaSort = activeCol => state.talksFilter.sortCol !== activeCol ? "none" : (state.talksFilter.sortDir === "asc" ? "ascending" : "descending");

      wrapEl.innerHTML = `
        <table class="data-table responsive-table talks-table">
          <caption class="t-micro">Sessions, sorted by ${sortCap}</caption>
          <thead>
            <tr>
              <th class="t-micro" aria-sort="${ariaSort("id")}"><button type="button" class="sort-btn t-micro" data-sort="id">№ ${triSvg("id")}</button></th>
              <th class="t-micro" aria-sort="${ariaSort("title")}"><button type="button" class="sort-btn t-micro" data-sort="title">Title ${triSvg("title")}</button></th>
              <th class="t-micro col-speakers">Speakers</th>
              <th class="t-micro">Track</th>
              <th class="t-micro">Type</th>
              <th class="t-micro" aria-sort="${ariaSort("day")}"><button type="button" class="sort-btn t-micro" data-sort="day">Day / Time ${triSvg("day")}</button></th>
              <th class="t-micro">Room</th>
            </tr>
          </thead>
          <tbody>
            ${list.map(s => {
              const d = dayById(s.day);
              const r = roomById(s.room);
              const tr = trackById(s.track);
              const isOpen = state.talksFilter.openId === s.id;
              const spks = s.speakers.map(id => `<a class="u-anim" href="#/speakers/${esc(id)}">${highlightText(speakerById(id).name, state.talksFilter.query)}</a>`).join(", ");
              const added = state.agenda.includes(s.id);
              return `
                <tr class="talk-row" id="talk-row-${esc(s.id)}" data-track="${esc(s.track)}">
                  <td data-label="№" class="t-small tnum">${esc(s.id)}</td>
                  <td data-label="Title" class="t-small fw-600">
                    <button type="button" class="btn-text t-small fw-600 u-anim" data-disc="${esc(s.id)}" aria-expanded="${isOpen ? "true" : "false"}" aria-controls="expand-${esc(s.id)}">${highlightText(s.title, state.talksFilter.query)}</button>
                  </td>
                  <td data-label="Speakers" class="t-small col-speakers">${spks}</td>
                  <td data-label="Track" class="t-small"><span class="track-chip track-chip-${esc(s.track)}">${esc(tr.label)}</span></td>
                  <td data-label="Type" class="t-small">${esc(s.type)}</td>
                  <td data-label="Day / Time" class="t-small tnum">${esc(d.shortLabel)} · ${fmtTime(s.start)}–${fmtTime(s.end)}</td>
                  <td data-label="Room" class="t-small">${esc(r.name)}</td>
                </tr>
                ${isOpen ? `
                  <tr class="talk-expand-row" id="expand-${esc(s.id)}">
                    <td colspan="7">
                      <p class="t-body">${highlightText(s.abstract, state.talksFilter.query)}</p>
                      <div style="margin-top:16px;display:flex;flex-wrap:wrap;gap:16px;align-items:center;">
                        <span class="t-micro">Speakers: ${spks}</span>
                        <button type="button" class="chip-toggle t-micro" data-ag="${esc(s.id)}" aria-pressed="${added ? "true" : "false"}">${added ? "(In agenda)" : "(Add to agenda)"}</button>
                      </div>
                    </td>
                  </tr>
                ` : ""}
              `;
            }).join("")}
          </tbody>
        </table>
      `;

      wrapEl.querySelectorAll("[data-sort]").forEach(btn => {
        btn.addEventListener("click", () => {
          const c = btn.dataset.sort;
          if (state.talksFilter.sortCol === c) {
            state.talksFilter.sortDir = state.talksFilter.sortDir === "asc" ? "desc" : "asc";
          } else {
            state.talksFilter.sortCol = c;
            state.talksFilter.sortDir = "asc";
          }
          renderTable();
        });
      });

      wrapEl.querySelectorAll("[data-disc]").forEach(btn => {
        btn.addEventListener("click", () => {
          const id = btn.dataset.disc;
          state.talksFilter.openId = state.talksFilter.openId === id ? null : id;

      wrapEl.querySelectorAll("[data-ag]").forEach(btn => {
        btn.addEventListener("click", () => {
          toggleAgenda(btn.dataset.ag);
          renderTable();
        });
      });
    }

    searchInput.addEventListener("input", () => {
      state.talksFilter.query = searchInput.value;
      renderTable();
    });

    typeBtns.forEach(btn => {
      btn.addEventListener("click", () => {
        const tp = btn.dataset.type;
        const i = state.talksFilter.types.indexOf(tp);
        if (i === -1) state.talksFilter.types.push(tp);

    trackBtns.forEach(btn => {

        if (i === -1) state.talksFilter.tracks.push(tid);
        else state.talksFilter.tracks.splice(i, 1);
        btn.setAttribute("aria-pressed", i === -1 ? "true" : "false");
        renderTable();

    renderTable();

    if (sessionId) {

      if (targetRow) {

          const top = targetRow.getBoundingClientRect().top + window.scrollY - 120;
          window.scrollTo({ top: Math.max(0, top), behavior: "auto" });
        });
      }
    }
  }

  function renderVenue(main) {
    document.title = "Venue" + DATA.copy.siteTitleSuffix;
    main.innerHTML = `

    function updatePlan(activeId) {
      state.selectedRoom = activeId;

        const isSel = rp.id === activeId;
        const fill = isSel ? rp.fill : DATA.tokens.sodium;
        const textCol = isSel ? rp.text : DATA.tokens.ink;
        const rm = roomById(rp.id);

        const chipMarkup = rp.chip
          ? `<rect x="${rp.x + rp.w - 3.2}" y="${rp.y + 0.5}" width="2.7" height="1.6" fill="${DATA.tokens.paper}" stroke="${DATA.tokens.ink}" stroke-width="0.2"/><text x="${rp.x + rp.w - 1.85}" y="${rp.y + 1.6}" text-anchor="middle" font-size="0.9" font-weight="600" fill="${DATA.tokens.ink}">${rp.chip}</text>`

    async function decodeQrFromCanvas(canvas) {
      if ("BarcodeDetector" in window) {
        try {
          const detector = new window.BarcodeDetector({ formats: ["qr_code"] });
          const results = await detector.detect(canvas);
          if (results && results.length > 0 && results[0].rawValue) {
            return results[0].rawValue;
          }
        } catch (e) {
          // Fall through to jsQR
        }
      }
      if (typeof window.AFJ_JSQR === "function") {
        try {
          const ctx = canvas.getContext("2d", { willReadFrequently: true });
          const imgData = ctx.getImageData(0, 0, canvas.width, canvas.height);
          const decoded = window.AFJ_JSQR(imgData.data, canvas.width, canvas.height, { inversionAttempts: "attemptBoth" });
          if (decoded && decoded.data) return decoded.data;
        } catch (e) {
          // Decode failed
        }
      }
      return null;
    }

    function extractTicketCode(rawPayload) {
      const trimmed = String(rawPayload || "").trim();
      if (!trimmed) return "";
      if (trimmed.startsWith("{") && trimmed.endsWith("}")) {
        try {
          const obj = JSON.parse(trimmed);
          const candidate = obj.code || obj.ticketId || obj.orderId || obj.barcode || obj.ticket;
          if (candidate) return String(candidate).trim();
        } catch (e) {}
      }
      if (/^https?:\/\//i.test(trimmed)) {
        try {
          const u = new URL(trimmed);
          const param = u.searchParams.get("code") || u.searchParams.get("ticket") || u.searchParams.get("eid") || u.searchParams.get("order");
          if (param) return param.trim();
        } catch (e) {}
      }
      return trimmed;
    }

    function inferTierFromCode(code) {
      const up = code.toUpperCase();
      if (up.includes("-EB-") || up.includes("EARLY")) return "Early Bird (£15)";
      if (up.includes("-GA-") || up.includes("GENERAL")) return "General Admission (£20)";
      if (up.includes("-VIP-") || up.includes("GUEST")) return "Collective Guest";
      return "Eventbrite Pass";
    }

    async function verifyTicketCode(rawPayload, inputSource, opts) {
      const verifyStartMs = (typeof performance !== "undefined" && typeof performance.now === "function") ? performance.now() : Date.now();
      const o = opts || {};
      const silentFeedback = Boolean(o.silentFeedback);
      const resolveDurationMs = () => {
        if (typeof o.detectDurationMs === "number" && Number.isFinite(o.detectDurationMs)) {
          return Math.max(1, Math.round(o.detectDurationMs));
        }
        const nowMs = (typeof performance !== "undefined" && typeof performance.now === "function") ? performance.now() : Date.now();
        return Math.max(1, Math.round(nowMs - verifyStartMs));
      };
      const code = extractTicketCode(rawPayload);
      if (!code) {
        renderScanResult({
          status: "invalid",
          kicker: "(Empty payload)",
          headline: "No QR code detected",
          desc: "Try holding the QR code steady in frame, uploading a sharper screenshot, or entering the ticket code manually.",
          code: "—",
          tier: "—",
          holder: "—",
          source: inputSource,
          silentFeedback
        });
        return;
      }

      const apiUrl = (state.scannerApiUrl || DATA.cms.verifyEndpoint || "").trim();
      if (apiUrl) {
        renderScanResult({
          status: "checking",
          kicker: "(Verifying via external API)",
          headline: "Checking ticket status…",
          desc: `Querying ${apiUrl} for ${code}`,
          code,
          tier: "Pending",
          holder: "Pending",
          source: "External API",
          silentFeedback: true
        });
        try {
          const res = await fetch(apiUrl, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ code, raw: rawPayload, event: DATA.meta.name })
          });
          if (res.ok) {
            const data = await res.json();
            const apiStatus = data.status || (data.valid ? "valid" : "invalid");
            renderScanResult({
              status: apiStatus,
              kicker: apiStatus === "valid" ? "(API Verified · Entry permitted)" : apiStatus === "checked_in" ? "(API Verified · Duplicate scan)" : "(API Rejected)",
              headline: apiStatus === "valid" ? "Valid Ticket — Ready for Entry" : apiStatus === "checked_in" ? "Already Checked In" : "Invalid or Unrecognized Ticket",
              desc: data.message || "Verified against configured Eventbrite/backend endpoint.",
              code,
              tier: data.tier || inferTierFromCode(code),
              holder: data.holder || "Ticket Holder",
              source: "External Verification API",
              allowCheckIn: apiStatus === "valid",
              detectDurationMs: apiStatus === "valid" ? resolveDurationMs() : null,
              silentFeedback
            });
            return;
          }
        } catch (e) {
          // Fall back to CMS + Eventbrite format verification with clear source note
        }
      }

      const normCode = code.toUpperCase();
      const existingCheckin = state.checkins.find(c => c.code.toUpperCase() === normCode);
      if (existingCheckin) {
        renderScanResult({
          status: "checked_in",
          kicker: "(Duplicate scan)",
          headline: "Already Checked In",
          desc: `This ticket was checked in at ${existingCheckin.checkedInAt}. Verify ID if duplicate entry is unexpected.`,
          code,
          tier: existingCheckin.tier,
          holder: existingCheckin.holder,
          source: existingCheckin.source,
          detectDurationMs: typeof existingCheckin.detectDurationMs === "number" ? existingCheckin.detectDurationMs : null,
          allowUndo: true,
          silentFeedback
        });
        return;
      }

      const cmsPass = (DATA.cms.passes || []).find(p => String(p.code).toUpperCase() === normCode);
      if (cmsPass) {
        if (cmsPass.status === "checked_in") {
          renderScanResult({
            status: "checked_in",
            kicker: "(CMS Pass Registry · Used)",
            headline: "Already Checked In",
            desc: "Marked as checked in within the CMS pass registry.",
            code: cmsPass.code,
            tier: cmsPass.tier,
            holder: cmsPass.holder,
            source: "Netlify CMS Registry",
            silentFeedback
          });
          return;
        }
        if (cmsPass.status === "revoked") {
          renderScanResult({
            status: "invalid",
            kicker: "(CMS Pass Registry · Revoked)",
            headline: "Ticket Revoked",
            desc: "This pass has been marked revoked in the CMS pass registry.",
            code: cmsPass.code,
            tier: cmsPass.tier,
            holder: cmsPass.holder,
            source: "Netlify CMS Registry",
            silentFeedback
          });
          return;
        }
        renderScanResult({
          status: "valid",
          kicker: "(CMS Pass Registry · Entry permitted)",
          headline: "Valid Ticket — Ready for Entry",
          desc: "Matched in AFJ Cardiff CMS pass registry. Press Confirm Check-In to admit guest.",
          code: cmsPass.code,
          tier: cmsPass.tier,
          holder: cmsPass.holder,
          source: "Netlify CMS Registry",
          allowCheckIn: true,
          detectDurationMs: resolveDurationMs(),
          silentFeedback
        });
        return;
      }

      const prefixes = (DATA.cms.acceptedPrefixes || ["AFJ-", "EB-", "EVT-", "WMC-"]).map(p => String(p).toUpperCase());
      const matchesPrefix = prefixes.some(p => normCode.startsWith(p) && normCode.length >= p.length + 5);
      const matchesEventbriteUrl = /eventbrite\./i.test(rawPayload) && rawPayload.length >= 24;
      const matchesBarcode = /^\d{10,24}$/.test(code);
      const matchesJson = rawPayload.trim().startsWith("{") && code.length >= 5;

      if (matchesPrefix || matchesEventbriteUrl || matchesBarcode || matchesJson) {
        renderScanResult({
          status: "valid",
          kicker: "(AFJ / Eventbrite QR format · Entry permitted)",
          headline: "Valid Eventbrite / AFJ Format",
          desc: "Format verified locally. Connect an Eventbrite proxy endpoint in settings for live barcode settlement.",
          code,
          tier: inferTierFromCode(code),
          holder: "Eventbrite Guest",
          source: matchesEventbriteUrl ? "Eventbrite QR URL" : matchesBarcode ? "Eventbrite Barcode" : "AFJ Ticket Format",
          allowCheckIn: true,
          detectDurationMs: resolveDurationMs(),
          silentFeedback
        });
        return;
      }

      renderScanResult({
        status: "invalid",
        kicker: "(Verification failed)",
        headline: "Invalid or Unrecognized QR Code",
        desc: `Payload "${code.slice(0, 48)}" did not match registered CMS passes or AFJ/Eventbrite ticket formats.`,
        code,
        tier: "Unrecognized",
        holder: "—",
        source: inputSource,
        silentFeedback
      });
    }

    function normalizeSummaryTier(rawTier, status) {
      if (status === "invalid") return "Invalid / Unrecognized";
      const t = String(rawTier || "").trim();
      const up = t.toUpperCase();
      if (up.includes("EARLY BIRD")) return "Early Bird";
      if (up.includes("GENERAL ADMISSION")) return "General Admission";
      if (up.includes("COLLECTIVE GUEST")) return "Collective Guest";
      if (up.includes("EVENTBRITE PASS")) return "Eventbrite Pass";
      return t || "Eventbrite Pass";
    }

    function recordDailyScan(code, tier, status) {
      const normKey = String(code || "").trim().toUpperCase();
      if (!normKey || normKey === "—") return;
      const store = ensureTodayDailyScans();
      store.entries[normKey] = {
        code: String(code).trim(),
        tier: normalizeSummaryTier(tier, status),
        status,
        lastScannedAt: new Date().toISOString()
      };
      storageSet("afj5.dailyScans", store);
      renderDailySummary();
    }

    function ensureAudioCtx() {
      if (typeof window === "undefined") return null;
      const AudioCtor = window.AudioContext || window.webkitAudioContext;
      if (!AudioCtor) return null;
      if (!scanAudioCtx || scanAudioCtx.state === "closed") {
        try {
          scanAudioCtx = new AudioCtor();
        } catch (e) {
          return null;
        }
      }
      if (scanAudioCtx.state === "suspended" && typeof scanAudioCtx.resume === "function") {
        try { scanAudioCtx.resume().catch(() => {}); } catch (e) {}
      }
      return scanAudioCtx;
    }

    function playScanTone(status) {
      const vol = Math.min(100, Math.max(0, Number(state.scannerVolume)));
      const volScale = vol / 100;
      if (!state.scannerHaptics || volScale <= 0) return;
      const ctx = ensureAudioCtx();
      if (!ctx) return;
      try {
        const now = ctx.currentTime;
        if (status === "valid") {
          // Subtle, crisp ascending 'ping'
          const osc = ctx.createOscillator();
          const gain = ctx.createGain();
          osc.type = "sine";
          osc.frequency.setValueAtTime(880, now);
          osc.frequency.exponentialRampToValueAtTime(1174.66, now + 0.055);
          gain.gain.setValueAtTime(0.0001, now);
          gain.gain.linearRampToValueAtTime(0.16 * volScale, now + 0.01);
          gain.gain.exponentialRampToValueAtTime(0.0001, now + 0.16);
          osc.connect(gain);
          gain.connect(ctx.destination);
          osc.start(now);
          osc.stop(now + 0.17);
        } else if (status === "checked_in") {
          // Soft double-ping warning for duplicate scans
          [0, 0.1].forEach(offset => {
            const osc = ctx.createOscillator();
            const gain = ctx.createGain();
            const t0 = now + offset;
            osc.type = "sine";
            osc.frequency.setValueAtTime(659.25, t0);
            gain.gain.setValueAtTime(0.0001, t0);
            gain.gain.linearRampToValueAtTime(0.12 * volScale, t0 + 0.008);
            gain.gain.exponentialRampToValueAtTime(0.0001, t0 + 0.075);
            osc.connect(gain);
            gain.connect(ctx.destination);
            osc.start(t0);
            osc.stop(t0 + 0.085);
          });
        } else if (status === "invalid") {
          // Subtle, muted low 'thud'
          const osc = ctx.createOscillator();
          const gain = ctx.createGain();
          osc.type = "triangle";
          osc.frequency.setValueAtTime(155, now);
          osc.frequency.exponentialRampToValueAtTime(58, now + 0.11);
          gain.gain.setValueAtTime(0.0001, now);
          gain.gain.linearRampToValueAtTime(0.26 * volScale, now + 0.008);
          gain.gain.exponentialRampToValueAtTime(0.0001, now + 0.14);
          if (typeof ctx.createBiquadFilter === "function") {
            const filter = ctx.createBiquadFilter();
            filter.type = "lowpass";
            filter.frequency.setValueAtTime(280, now);
            osc.connect(filter);
            filter.connect(gain);
          } else {
            osc.connect(gain);
          }
          gain.connect(ctx.destination);
          osc.start(now);
          osc.stop(now + 0.15);
        }
      } catch (e) {
        // Ignore audio synthesis restrictions
      }
    }

    function triggerValidScanHaptic() {
      if (!state.motionOn || !state.scannerHaptics) return;
      if (typeof navigator !== "undefined" && typeof navigator.vibrate === "function") {
        try {
          navigator.vibrate([45, 30, 65]);
        } catch (e) {}
      }
    }

    function refreshHapticUI() {
      const supported = typeof navigator !== "undefined" && typeof navigator.vibrate === "function";
      const active = Boolean(state.scannerHaptics);
      const vol = Math.min(100, Math.max(0, Math.round(Number(state.scannerVolume) || 0)));
      if (qrVolumeSlider && Number(qrVolumeSlider.value) !== vol) {
        qrVolumeSlider.value = String(vol);
      }
      if (qrVolumeValue) {
        qrVolumeValue.textContent = `${vol}%`;
      }
      if (qrHapticsToggle) {
        qrHapticsToggle.setAttribute("aria-pressed", active ? "true" : "false");
        qrHapticsToggle.textContent = active ? "(Haptics: on)" : "(Haptics: off)";
      }
      if (qrHapticNote) {
        if (!active) {
          qrHapticNote.textContent = "Audio cues & haptics muted for this scanner.";
        } else if (vol === 0) {
          qrHapticNote.textContent = supported && state.motionOn
            ? "Sound volume at 0% (muted); haptic pulse enabled."
            : "Sound volume at 0% (muted).";
        } else if (!supported) {
          qrHapticNote.textContent = `Sound cues at ${vol}% (ping / double-ping / thud); haptic vibration unavailable on this browser.`;
        } else if (!state.motionOn) {
          qrHapticNote.textContent = `Sound cues at ${vol}% (ping / double-ping / thud); haptics paused while site Motion is off.`;
        } else {
          qrHapticNote.textContent = `Sound cues at ${vol}% (ping / double-ping / thud) & haptic pulse enabled.`;
        }
      }
    }

    function renderDailySummary() {
      const store = ensureTodayDailyScans();
      const items = Object.values(store.entries);
      if (qrSummaryDate) {
        qrSummaryDate.textContent = `(Today's scan summary · ${store.date})`;
      }
      if (qrSummaryTotal) {
        qrSummaryTotal.textContent = String(items.length);
      }
      if (qrResetDailyBtn) {
        qrResetDailyBtn.disabled = items.length === 0;
        qrResetDailyBtn.style.opacity = items.length === 0 ? "0.45" : "1";
        qrResetDailyBtn.style.cursor = items.length === 0 ? "not-allowed" : "pointer";
      }
      if (!qrSummaryTiers) return;
      const baseTiers = ["Early Bird", "General Admission", "Collective Guest", "Eventbrite Pass", "Invalid / Unrecognized"];
      const counts = new Map();
      baseTiers.forEach(name => counts.set(name, 0));
      items.forEach(entry => {
        const name = entry.tier || "Eventbrite Pass";
        counts.set(name, (counts.get(name) || 0) + 1);
      });
      qrSummaryTiers.innerHTML = Array.from(counts.entries()).map(([label, cnt]) => `
        <div class="qr-summary-tier-row t-micro">
          <span>${esc(label)}</span>
          <span class="fw-600 tnum">${cnt}</span>
        </div>
      `).join("");
    }

    function renderScanResult(res) {
      qrResBox.setAttribute("data-status", res.status);
      qrResKicker.textContent = res.kicker;
      qrResHeadline.textContent = res.headline;
      qrResDesc.textContent = res.desc;

      if (res.status === "idle") {
        qrResMeta.hidden = true;
        qrResActions.hidden = true;
        return;
      }

      if (res.status === "valid" || res.status === "checked_in" || res.status === "invalid") {
        recordDailyScan(res.code, res.tier, res.status);
        if (!res.silentFeedback) {
          playScanTone(res.status);
        }
      }
      if (res.status === "valid" && !res.silentFeedback) {
        triggerValidScanHaptic();
      }

      const hasDuration = typeof res.detectDurationMs === "number" && Number.isFinite(res.detectDurationMs);
      qrResMeta.hidden = false;
      qrResMeta.innerHTML = `
        <div><p class="t-micro">Ticket code</p><p class="t-small fw-600 tnum">${esc(res.code)}</p></div>
        <div><p class="t-micro">Tier</p><p class="t-small fw-600">${esc(res.tier)}</p></div>
        <div><p class="t-micro">Guest</p><p class="t-small fw-600">${esc(res.holder)}</p></div>
        <div><p class="t-micro">Verification source</p><p class="t-small">${esc(res.source)}</p></div>
        ${hasDuration ? `<div><p class="t-micro">Detection time</p><p class="t-small fw-600 tnum">${res.detectDurationMs} ms</p></div>` : ""}
      `;

      const btns = [];
      if (res.allowCheckIn) {
        btns.push(`<button type="button" class="btn-primary btn-sm t-small" id="qr-confirm-checkin-btn"><span>Confirm check-in</span></button>`);
      }
      if (res.allowUndo) {
        btns.push(`<button type="button" class="chip-toggle t-micro" id="qr-undo-checkin-btn" style="background:var(--paper);color:var(--ink);">(Undo local check-in)</button>`);
      }
      btns.push(`<button type="button" class="chip-toggle t-micro" id="qr-scan-next-btn" style="background:var(--paper);color:var(--ink);">(Scan next)</button>`);

      qrResActions.hidden = false;
      qrResActions.innerHTML = btns.join("");

      const confirmBtn = document.getElementById("qr-confirm-checkin-btn");
      if (confirmBtn) {
        confirmBtn.addEventListener("click", () => {
          const nowDate = new Date();
          const nowTime = nowDate.toLocaleTimeString("en-GB", { hour: "2-digit", minute: "2-digit" });
          state.checkins.unshift({
            code: res.code,
            tier: res.tier,
            holder: res.holder,
            source: res.source,
            detectDurationMs: hasDuration ? res.detectDurationMs : null,
            checkedInAt: nowTime,
            checkedInISO: nowDate.toISOString()
          });
          storageSet("afj5.checkins", state.checkins.slice(0, 50));
          renderHistory();
          verifyTicketCode(res.code, res.source, { silentFeedback: true, detectDurationMs: hasDuration ? res.detectDurationMs : undefined });
        });
      }

      const undoBtn = document.getElementById("qr-undo-checkin-btn");
      if (undoBtn) {
        undoBtn.addEventListener("click", () => {
          state.checkins = state.checkins.filter(c => c.code.toUpperCase() !== res.code.toUpperCase());
          storageSet("afj5.checkins", state.checkins);
          renderHistory();
          verifyTicketCode(res.code, res.source, { silentFeedback: true });
        });
      }

      const nextBtn = document.getElementById("qr-scan-next-btn");
      if (nextBtn) {
        nextBtn.addEventListener("click", () => {
          lastScannedCode = "";
          camTipDismissed = false;
          camScanSessionStartMs = (typeof performance !== "undefined" && typeof performance.now === "function") ? performance.now() : Date.now();
          renderScanResult({
            status: "idle",
            kicker: "(Ready to scan)",
            headline: "Waiting for ticket QR code…",
            desc: "Scan via camera, upload an image, or enter a ticket code to verify entry status."
          });
          if (activeQrTab === "camera") {
            if (!camStream) startCamera();
            else armCameraOrientTimer();
          }
        });
      }
    }

    function renderHistory() {
      const count = Array.isArray(state.checkins) ? state.checkins.length : 0;
      if (qrHistoryHeading) {
        qrHistoryHeading.textContent = count > 0
          ? `(Recent check-ins on this device · ${count})`
          : "(Recent check-ins on this device)";
      }
      if (qrExportCsvBtn) {
        qrExportCsvBtn.disabled = count === 0;
        qrExportCsvBtn.style.opacity = count === 0 ? "0.45" : "1";
        qrExportCsvBtn.style.cursor = count === 0 ? "not-allowed" : "pointer";
      }
      if (count === 0) {
        qrHistoryList.innerHTML = `<p class="t-micro" style="padding-top:8px;">No tickets checked in on this device yet.</p>`;
        return;
      }
      qrHistoryList.innerHTML = state.checkins.slice(0, 6).map(item => {
        const hasDur = typeof item.detectDurationMs === "number" && Number.isFinite(item.detectDurationMs);
        const durBadge = hasDur
          ? `<span class="qr-history-duration tnum" title="QR detection time">${Math.round(item.detectDurationMs)} ms</span>`
          : "";
        return `
          <div class="qr-history-item t-micro">
            <span><strong>${esc(item.code)}</strong> · ${esc(item.tier)} (${esc(item.holder)})</span>
            <span class="qr-history-meta tnum">${durBadge}<span>Checked in ${esc(item.checkedInAt)}</span></span>
          </div>
        `;
      }).join("");
    }

    function scheduleCameraScanLoop() {
      if (activeQrTab !== "camera" || !camStream) return;
      if (!camScanSessionStartMs) {
        camScanSessionStartMs = (typeof performance !== "undefined" && typeof performance.now === "function") ? performance.now() : Date.now();
      }
      scanTimer = window.setTimeout(async () => {
        if (activeQrTab !== "camera" || !camStream) return;
        if (!isDecoding && qrVideo.readyState >= 2 && qrVideo.videoWidth > 0) {
          isDecoding = true;
          try {
            const w = Math.min(640, qrVideo.videoWidth);
            const h = Math.round((qrVideo.videoHeight / qrVideo.videoWidth) * w);
            scanCanvas.width = w;
            scanCanvas.height = h;
            scanCtx.drawImage(qrVideo, 0, 0, w, h);
            const raw = await decodeQrFromCanvas(scanCanvas);
            if (raw) {
              hideCameraOrientTip(true);
              const now = Date.now();
              if (raw !== lastScannedCode || now - lastScannedAt > 3000) {
                const nowPerf = (typeof performance !== "undefined" && typeof performance.now === "function") ? performance.now() : Date.now();
                const detectDurationMs = camScanSessionStartMs ? Math.max(1, Math.round(nowPerf - camScanSessionStartMs)) : null;
                camScanSessionStartMs = 0;
                lastScannedCode = raw;
                lastScannedAt = now;
                await verifyTicketCode(raw, "Camera QR Scan", { detectDurationMs });
              }
            }
          } finally {
            isDecoding = false;
          }
        }
        scheduleCameraScanLoop();
      }, 200);
    }

    async function startCamera() {
      stopCamera();
      camTipDismissed = false;
      armCameraOrientTimer();
      qrCamMsg.hidden = false;
      qrCamStatusTxt.textContent = "Requesting camera access for QR scanning…";
      if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
        qrCamStatusTxt.textContent = "Camera API unavailable in this browser/context. Use Upload QR image or Manual / Test codes.";
        return;
      }
      try {
        camStream = await navigator.mediaDevices.getUserMedia({
          video: { facingMode: { ideal: "environment" } },
          audio: false
        });
        qrVideo.srcObject = camStream;
        await qrVideo.play();
        camScanSessionStartMs = (typeof performance !== "undefined" && typeof performance.now === "function") ? performance.now() : Date.now();
        qrCamMsg.hidden = true;
        armCameraOrientTimer();
        scheduleCameraScanLoop();
      } catch (err) {
        stopCamera();
        qrCamMsg.hidden = false;
        qrCamStatusTxt.textContent = "Camera access denied or no webcam found. Switch to Upload QR image or Manual / Test codes.";
        armCameraOrientTimer();
      }
    }

    function setQrTab(tab) {
      activeQrTab = tab;
      qrTabBtns.forEach(b => {
        const isOn = b.dataset.qrTab === tab;
        b.setAttribute("aria-selected", isOn ? "true" : "false");
        b.setAttribute("aria-pressed", isOn ? "true" : "false");
      });
      Object.keys(qrPanels).forEach(k => {
        qrPanels[k].hidden = k !== tab;
      });
      if (tab === "camera") startCamera();
      else stopCamera();
    }

    async function handleQrImageFile(file) {
      if (!file) return;
      const uploadStartMs = (typeof performance !== "undefined" && typeof performance.now === "function") ? performance.now() : Date.now();
      const url = URL.createObjectURL(file);
      qrUploadPreview.src = url;
      qrUploadPreview.classList.add("is-visible");
      const img = new Image();
      img.onload = async () => {
        try {
          const maxDim = 1024;
          const scale = Math.min(1, maxDim / Math.max(img.naturalWidth || 1, img.naturalHeight || 1));
          scanCanvas.width = Math.max(1, Math.round(img.naturalWidth * scale));
          scanCanvas.height = Math.max(1, Math.round(img.naturalHeight * scale));
          scanCtx.drawImage(img, 0, 0, scanCanvas.width, scanCanvas.height);
          const raw = await decodeQrFromCanvas(scanCanvas);
          if (raw) {
            const nowPerf = (typeof performance !== "undefined" && typeof performance.now === "function") ? performance.now() : Date.now();
            const detectDurationMs = Math.max(1, Math.round(nowPerf - uploadStartMs));
            await verifyTicketCode(raw, "Uploaded QR Image", { detectDurationMs });
          } else {
            renderScanResult({
              status: "invalid",
              kicker: "(Image decode failed)",
              headline: "No QR code found in image",
              desc: "Ensure the QR code is crisp, well-lit, and uncropped, or enter the code manually.",
              code: file.name,
              tier: "—",
              holder: "—",
              source: "Image Upload"
            });
          }
        } finally {
          URL.revokeObjectURL(url);
        }
      };
      img.onerror = () => {
        URL.revokeObjectURL(url);
      };
      img.src = url;
    }

    // Populate quick sample test buttons from CMS passes + invalid example
    const sampleItems = (DATA.cms.passes || []).slice(0, 3).map(p => ({ label: `${p.code} (${p.tier})`, code: p.code }));
    sampleItems.push({ label: "INVALID-CODE-000", code: "INVALID-CODE-000" });
    qrSamplesRow.innerHTML = sampleItems.map(s =>
      `<button type="button" class="chip-toggle t-micro" data-qr-sample="${esc(s.code)}">${esc(s.label)}</button>`
    ).join("");

      ].map(csvCell).join(","));

    function drawEditor() {
      const rect = canvas.getBoundingClientRect();
      const maxPx = Math.min(rect.width || 320, 640);
      const cell = Math.max(12, Math.floor(maxPx / 16));
      const size = cell * 16;
      const dpr = Math.min(window.devicePixelRatio || 1, 2);
      if (canvas.width !== Math.round(size * dpr)) {
        canvas.width = Math.round(size * dpr);
        canvas.height = Math.round(size * dpr);
      }
      const ctx = canvas.getContext("2d");
      if (!ctx) return;
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
      ctx.fillStyle = DATA.tokens.ink;
      ctx.fillRect(0, 0, size, size);

      for (let r = 0; r < 16; r++) {

          const palId = grid[r * 16 + c];
          const palObj = BADGE_PALETTE[Number(palId)] || BADGE_PALETTE[1];
          ctx.fillStyle = palObj.hex;
          ctx.fillRect(c * cell + 1, r * cell + 1, cell - 1, cell - 1);
        }
      }

      if (canvasFocused) {
        ctx.strokeStyle = DATA.tokens.sodium;
        ctx.lineWidth = 2;
        ctx.strokeRect(keyC * cell + 2, keyR * cell + 2, cell - 4, cell - 4);
      }
    }

    function updateStatus() {
      const palId = grid[keyR * 16 + keyC];
      const palObj = BADGE_PALETTE[Number(palId)] || BADGE_PALETTE[1];

      const spriteSize = 16 * 15;

        ${stripRects}
      `;
    }

    function paintAt(r, c, colorId) {
      if (r < 0 || r >= 16 || c < 0 || c >= 16) return;
      grid[r * 16 + c] = colorId;
      if (mirror) {
        grid[r * 16 + (15 - c)] = colorId;
      }
    }

    function floodFill(r, c, newCol) {
      const target = grid[r * 16 + c];
      if (target === newCol) return;
      const queue = [[r, c]];
      const seen = new Set();
      while (queue.length > 0) {
        const [cr, cc] = queue.shift();
        const k = cr * 16 + cc;
        if (cr < 0 || cr >= 16 || cc < 0 || cc >= 16 || seen.has(k) || grid[k] !== target) continue;
        seen.add(k);
        grid[k] = newCol;
        queue.push([cr - 1, cc], [cr + 1, cc], [cr, cc - 1], [cr, cc + 1]);
      }
    }

    function coordsFromEvent(e) {
      const rect = canvas.getBoundingClientRect();
      const c = Math.min(15, Math.max(0, Math.floor(((e.clientX - rect.left) / rect.width) * 16)));
      const r = Math.min(15, Math.max(0, Math.floor(((e.clientY - rect.top) / rect.height) * 16)));
      return { r, c };
    }

    canvas.addEventListener("contextmenu", e => e.preventDefault());
    canvas.addEventListener("pointerdown", e => {
      e.preventDefault();
      canvas.focus();
      const { r, c } = coordsFromEvent(e);
      keyR = r; keyC = c;
      pushHistory();
      if (e.button === 2) {
        painting = true;
        paintModeOverride = "1";
        paintAt(r, c, "1");
      } else if (mode === "fill") {
        floodFill(r, c, currentColor);
      } else {
        painting = true;
        paintModeOverride = mode === "erase" ? "1" : currentColor;
        paintAt(r, c, paintModeOverride);
      }
      if (canvas.setPointerCapture) {
        try { canvas.setPointerCapture(e.pointerId); } catch (err) {}
      }
      saveGrid();
      drawEditor();
      drawPreview();
      updateStatus();
    });

    canvas.addEventListener("pointermove", e => {
      if (!painting) return;
      const { r, c } = coordsFromEvent(e);
      keyR = r; keyC = c;
      paintAt(r, c, paintModeOverride);
      saveGrid();
      drawEditor();
      drawPreview();
      updateStatus();
    });

    const stopPaint = () => {
      painting = false;
      paintModeOverride = null;
    };
    canvas.addEventListener("pointerup", stopPaint);
    canvas.addEventListener("pointercancel", stopPaint);

    canvas.addEventListener("focus", () => {
      canvasFocused = true;
      drawEditor();
      updateStatus();
    });
    canvas.addEventListener("blur", () => {
      canvasFocused = false;
      drawEditor();
    });

    canvas.addEventListener("keydown", e => {
      if (e.key === "ArrowRight") { keyC = Math.min(15, keyC + 1); }
      else if (e.key === "ArrowLeft") { keyC = Math.max(0, keyC - 1); }
      else if (e.key === "ArrowDown") { keyR = Math.min(15, keyR + 1); }
      else if (e.key === "ArrowUp") { keyR = Math.max(0, keyR - 1); }
      else if (e.key === " " || e.key === "Enter") {
        e.preventDefault();
        pushHistory();
        if (mode === "fill") floodFill(keyR, keyC, currentColor);
        else paintAt(keyR, keyC, mode === "erase" ? "1" : currentColor);
        saveGrid();
        drawPreview();
      } else if (e.key === "Delete" || e.key === "Backspace") {
        e.preventDefault();
        pushHistory();
        paintAt(keyR, keyC, "1");
        saveGrid();
        drawPreview();
      } else if (e.key >= "1" && e.key <= "9") {
        selectColor(String(Number(e.key) - 1));
      } else {
        return;
      }
      e.preventDefault();
      drawEditor();
      updateStatus();
    });

    function selectColor(colId) {
      currentColor = colId;
      paletteBtns.forEach(b => b.setAttribute("aria-checked", b.dataset.col === colId ? "true" : "false"));
    }

    paletteBtns.forEach((btn, idx) => {
      btn.addEventListener("click", () => selectColor(btn.dataset.col));
      btn.addEventListener("keydown", e => {
        let next = -1;
        if (e.key === "ArrowRight" || e.key === "ArrowDown") next = (idx + 1) % paletteBtns.length;
        else if (e.key === "ArrowLeft" || e.key === "ArrowUp") next = (idx - 1 + paletteBtns.length) % paletteBtns.length;
        if (next >= 0) {
          e.preventDefault();
          selectColor(paletteBtns[next].dataset.col);
          paletteBtns[next].focus();
        }
      });
    });

    toolBtns.forEach(btn => {
      btn.addEventListener("click", () => {
        const t = btn.dataset.tool;
        if (t === "mirror") {
          mirror = !mirror;
          btn.setAttribute("aria-pressed", mirror ? "true" : "false");
          return;
        }
        mode = t;
        toolBtns.forEach(b => {
          if (b.dataset.tool !== "mirror") {
            b.setAttribute("aria-pressed", b.dataset.tool === mode ? "true" : "false");
          }
        });
      });
    });

    const galleryDialog = document.getElementById("adinkra-gallery-dialog");
    const galleryOpenBtn = document.getElementById("badge-adinkra-gallery");
    const galleryCloseBtn = document.getElementById("adinkra-dlg-close");
    const gallerySearchInput = document.getElementById("adinkra-search-input");
    const galleryGrid = document.getElementById("adinkra-gallery-grid");
    const filterRow = document.getElementById("adinkra-filter-row");

    let currentFilter = "all";
    let searchTerm = "";

    function renderGalleryCards() {
      if (!galleryGrid) return;
      const q = normText(searchTerm);
      const filtered = ADINKRA_MOTIFS.filter(m => {
        if (currentFilter !== "all" && m.theme !== currentFilter) return false;
        if (!q) return true;
        return normText(m.name).includes(q) || normText(m.meaning).includes(q) || normText(m.theme).includes(q);
      });

      if (filtered.length === 0) {
        galleryGrid.innerHTML = `<p class="t-micro" style="grid-column: 1 / -1; padding: 24px; text-align: center;">No Adinkra motifs match your search query.</p>`;
        return;
      }

      galleryGrid.innerHTML = filtered.map(m => {
        // Build 16x16 HTML preview grid cells
        const previewCells = m.pattern.map(rowStr => {
          return rowStr.split("").map(ch => {
            const hex = ch === "0" ? DATA.tokens.ink : (ch === "3" ? DATA.tokens.blue : (ch === "2" ? DATA.tokens.sodium : DATA.tokens.paper));
            return `<div style="background-color:${hex};"></div>`;
          }).join("");
        }).join("");

        return `
          <button type="button" class="adinkra-card" data-adinkra-id="${esc(m.id)}">
            <div class="adinkra-card-top">
              <div class="adinkra-name-wrap" title="${esc(m.meaning)}">
                <h3 class="t-small fw-600">${esc(m.name)}</h3>
                <p class="t-micro" style="text-transform: uppercase; color: var(--text-muted-on-paper); margin-top: 2px;">Theme: ${esc(m.theme)}</p>
                <div class="adinkra-tooltip" role="tooltip">
                  <span class="adinkra-tooltip-kicker">Cultural Meaning</span>
                  <span class="adinkra-tooltip-text">${esc(m.meaning)}</span>
                </div>
              </div>
              <div class="adinkra-card-preview" title="${esc(m.meaning)}">
                ${previewCells}
                <div class="adinkra-tooltip adinkra-tooltip-preview" role="tooltip">
                  <span class="adinkra-tooltip-kicker">Cultural Meaning</span>
                  <span class="adinkra-tooltip-text">${esc(m.meaning)}</span>
                </div>
              </div>
            </div>
            <p class="t-micro" style="line-height: 1.4;">${esc(m.meaning)}</p>
          </button>
        `;
      }).join("");
    }

    if (galleryOpenBtn && galleryDialog) {
      galleryOpenBtn.addEventListener("click", () => {
        renderGalleryCards();
        if (typeof galleryDialog.showModal === "function") galleryDialog.showModal();
        else galleryDialog.setAttribute("open", "");
        if (gallerySearchInput) gallerySearchInput.focus();
      });
    }

    if (galleryCloseBtn && galleryDialog) {
      galleryCloseBtn.addEventListener("click", () => {
        if (typeof galleryDialog.close === "function") galleryDialog.close();
        else galleryDialog.removeAttribute("open");
        galleryOpenBtn.focus();
      });
    }

    if (gallerySearchInput) {
      gallerySearchInput.addEventListener("input", e => {
        searchTerm = e.target.value;
        renderGalleryCards();
      });
    }

    if (filterRow) {
      filterRow.addEventListener("click", e => {
        const btn = e.target.closest("[data-filter]");
        if (!btn) return;
        currentFilter = btn.dataset.filter;
        filterRow.querySelectorAll("[data-filter]").forEach(b => b.setAttribute("aria-pressed", b === btn ? "true" : "false"));
        renderGalleryCards();
      });
    }

    if (galleryGrid) {
      galleryGrid.addEventListener("click", e => {
        const card = e.target.closest("[data-adinkra-id]");
        if (!card) return;
        const motifId = card.dataset.adinkraId;
        const motif = ADINKRA_MOTIFS.find(m => m.id === motifId);
        if (!motif) return;

        pushHistory();
        for (let r = 0; r < 16; r++) {
          const rowStr = motif.pattern[r] || "0000000000000000";
          for (let c = 0; c < 16; c++) {
            const ch = rowStr[c] || "0";
            if (ch !== "0") {
              grid[r * 16 + c] = ch === "3" ? "4" : (ch === "2" ? "2" : "3");
            }
          }
        }
        drawEditor();
        drawPreview();
        saveGrid();

        if (typeof galleryDialog.close === "function") galleryDialog.close();
        else galleryDialog.removeAttribute("open");
        canvas.focus();
      });
    }

    document.getElementById("badge-random").addEventListener("click", () => {
      pushHistory();
      const rng = makeRng(Date.now());
      const accent = String(3 + Math.floor(rng() * 6));
      const g = new Array(256).fill("1");
      for (let r = 2; r <= 13; r++) {
        for (let c = 0; c < 8; c++) {
          if (rng() < 0.42) {
            g[r * 16 + c] = accent;
            g[r * 16 + (15 - c)] = accent;
          }
        }
      }
      const eyeC = 3 + Math.floor(rng() * 4);
      g[6 * 16 + eyeC] = "0";
      g[6 * 16 + (15 - eyeC)] = "0";
      grid = g;
      saveGrid();
      drawEditor();
      drawPreview();
      updateStatus();
    });

    document.getElementById("badge-clear").addEventListener("click", () => {
      pushHistory();
      grid = new Array(256).fill("1");
      saveGrid();
      drawEditor();
      drawPreview();
      updateStatus();
    });

    const doUndo = () => {
      if (history.length === 0) return;
      grid = history.pop().split("");
      saveGrid();
      drawEditor();
      drawPreview();
      updateStatus();
    };
    document.getElementById("badge-undo").addEventListener("click", doUndo);

    const onKeyUndo = e => {
      if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === "z") {
        e.preventDefault();
        doUndo();
      }
    };
    document.addEventListener("keydown", onKeyUndo);

    nameInput.addEventListener("input", () => {
      state.badge.name = nameInput.value.slice(0, 18);
      storageSet("afj5.badge", state.badge);
      drawPreview();
    });

    document.getElementById("badge-dl-btn").addEventListener("click", () => {
      const ser = new XMLSerializer();
      const clone = previewSvg.cloneNode(true);
      clone.setAttribute("xmlns", "http://www.w3.org/2000/svg");
      clone.setAttribute("width", "320");
      clone.setAttribute("height", "480");
      const svgText = `<?xml version="1.0" encoding="UTF-8"?>\n` + ser.serializeToString(clone);
      const blob = new Blob([svgText], { type: "image/svg+xml;charset=utf-8" });
      const blobUrl = URL.createObjectURL(blob);
      const a = document.createElement("a");
      a.href = blobUrl;
      a.download = "afj-cardiff-badge.svg";
      document.body.appendChild(a);
      a.click();
      a.remove();
      window.setTimeout(() => URL.revokeObjectURL(blobUrl), 1000);
    });

    const ro = new ResizeObserver(drawEditor);
    ro.observe(canvas);
    state.routeCleanup.push(() => {
      ro.disconnect();
      document.removeEventListener("keydown", onKeyUndo);
    });

    drawEditor();
    drawPreview();
    updateStatus();
  }

  // Route 9: 404
  function renderNotFound(main) {
    document.title = "Not found" + DATA.copy.siteTitleSuffix;
    const ch = window.innerWidth >= 768 ? 16 : 8;
    main.innerHTML = `
      <section class="sub-sec" data-surface="sodium" data-pager="Not found">
        <div class="grid">
          <div class="col-full">
            ${svgBitmapText("404", ch, DATA.tokens.ink, { className: "notfound-bitmap", ariaHidden: true, bold: true })}
            <h1 class="t-h1" tabindex="-1">Nothing at this address.</h1>
            <div style="margin-top:32px;">
              <a class="btn-text t-lead u-anim" href="#/">(Back to the front page)</a>
            </div>
          </div>
        </div>
      </section>
    `;
  }

  // Hash Router
  let currentRouteKey = null;

  function parseRoute(hash) {
    const clean = (hash || "#/").replace(/^#/, "");
    if (clean === "" || clean === "/") return { view: "home", key: "home" };
    const parts = clean.split("/").filter(Boolean);
    if (parts[0] === "schedule" && parts.length === 1) return { view: "schedule", key: "schedule" };
    if (parts[0] === "speakers" && parts.length === 1) return { view: "speakers", key: "speakers" };
    if (parts[0] === "speakers" && parts.length === 2) return { view: "speaker", param: parts[1], key: "speaker:" + parts[1] };
    if (parts[0] === "talks" && parts.length === 1) return { view: "talks", key: "talks" };
    if (parts[0] === "talks" && parts.length === 2) return { view: "talks", param: parts[1], key: "talks:" + parts[1] };
    if (parts[0] === "venue" && parts.length === 1) return { view: "venue", key: "venue" };
    if (parts[0] === "tickets" && parts.length === 1) return { view: "tickets", key: "tickets" };
    if (parts[0] === "badge" && parts.length === 1) return { view: "badge", key: "badge" };
    return { view: "404", key: "404" };
  }

  function updateActiveNav(route) {
    const mapHref = {
      schedule: "#/schedule",
      speakers: "#/speakers",
      speaker: "#/speakers",
      talks: "#/talks",
      venue: "#/venue",
      tickets: "#/tickets",
      badge: "#/badge"
    }[route.view] || "";
    document.querySelectorAll("#header-nav a, #menu-nav a").forEach(a => {
      if (a.getAttribute("href") === mapHref) a.setAttribute("aria-current", "page");
      else a.removeAttribute("aria-current");
    });
  }

  function mountRoute(route, skipWipe) {
    const main = document.getElementById("main");
    const doSwap = () => {
      while (state.routeCleanup.length > 0) {
        const fn = state.routeCleanup.pop();
        try { fn(); } catch (e) {}
      }
      hideTip();

      if (route.view === "home") renderHome(main);
      else if (route.view === "schedule") renderSchedule(main);
      else if (route.view === "speakers") renderSpeakers(main);
      else if (route.view === "speaker") renderSpeakerDetail(main, route.param);
      else if (route.view === "talks") renderTalks(main, route.param);
      else if (route.view === "venue") renderVenue(main);
      else if (route.view === "tickets") renderTickets(main);
      else if (route.view === "badge") renderBadge(main);
      else renderNotFound(main);

      updateActiveNav(route);
      setupObservers();

      if (state.scrollAfterRoute) {
        const target = document.getElementById(state.scrollAfterRoute);
        state.scrollAfterRoute = null;
        if (target) target.scrollIntoView({ behavior: state.motionOn ? "smooth" : "auto" });
      } else if (!(route.view === "talks" && route.param)) {
        window.scrollTo(0, 0);
      }

      if (!skipWipe) {
        const h1 = main.querySelector("h1");
        if (h1) h1.focus({ preventScroll: true });
      }
    };

    if (skipWipe) doSwap();
    else playWipe(doSwap);
  }

  function init() {
    initChrome();
    initTrail();
    initReminderEngine();
    loadCmsConfig();
    const initial = parseRoute(window.location.hash);
    currentRouteKey = initial.key;
    mountRoute(initial, true);

    window.addEventListener("hashchange", () => {
      const next = parseRoute(window.location.hash);
      if (next.key === currentRouteKey) return;
      currentRouteKey = next.key;
      mountRoute(next, false);
    });
  }

  return { init };
})();

document.addEventListener("DOMContentLoaded", () => APP.init());
</script>
</body>
</html>
